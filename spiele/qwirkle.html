<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qwirkle Punktehelfer</title>
  <link rel="stylesheet" href="../styles.css">
  <script src="../theme.js"></script>
  <script src="../tournament.js"></script>
  <style>
    .container {
      width: 100%;
      max-width: 600px;
    }

    .btn {
      width: 100%;
    }

    /* SETUP SCREEN */
    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .input-group input {
      flex: 1;
    }

    .player-setup-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
    }

    .player-setup-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--md-sys-color-surface-container-low);
      border: 1px solid var(--md-sys-color-outline-variant);
      padding: 10px 14px;
      border-radius: var(--md-sys-shape-corner-md);
    }

    .btn-remove {
      background: none;
      border: none;
      color: var(--md-sys-color-error);
      font-size: 1.15rem;
      cursor: pointer;
      padding: 4px 8px;
      width: auto;
      box-shadow: none;
    }

    /* GAME SCREEN */
    .scoreboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .player-card {
      background-color: var(--md-sys-color-surface-container-lowest);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-sys-shape-corner-lg);
      padding: 14px 12px;
      text-align: center;
      position: relative;
      box-shadow: var(--md-sys-elevation-1);
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .player-card.active {
      border-color: var(--md-sys-color-primary);
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
    }

    .crown-icon {
      position: absolute;
      top: -10px;
      right: 8px;
      font-size: 1.25rem;
    }

    .player-name {
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-score {
      font-size: 1.7rem;
      font-weight: 700;
      color: var(--md-sys-color-primary);
    }

    .player-card.active .player-score {
      color: var(--md-sys-color-on-primary-container);
    }

    .player-diff {
      font-size: 0.74rem;
      color: var(--md-sys-color-on-surface-variant);
      margin-top: 2px;
      font-weight: 500;
    }

    .player-card.active .player-diff {
      color: var(--md-sys-color-on-primary-container);
      opacity: 0.85;
    }

    /* Active Player Controls */
    .active-player-header {
      text-align: center;
      font-size: 1.1rem;
      margin-bottom: 14px;
    }

    .active-player-header span {
      color: var(--md-sys-color-primary);
      font-weight: 700;
    }

    .points-input-box {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .points-input-box input {
      flex: 1;
      font-size: 1.2rem;
      text-align: center;
      font-weight: 700;
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .btn-qwirkle {
      background-color: var(--md-sys-color-purple-container);
      color: var(--md-sys-color-on-purple-container);
      border: 1px solid var(--md-sys-color-outline-variant);
      box-shadow: none;
    }

    .btn-swap {
      background-color: var(--md-sys-color-surface-container-low);
      color: var(--md-sys-color-on-surface);
      border: 1px solid var(--md-sys-color-outline-variant);
      box-shadow: none;
    }

    .btn-end-game {
      background-color: var(--md-sys-color-warning-container);
      color: var(--md-sys-color-on-warning-container);
      border: 1px solid var(--md-sys-color-warning);
      box-shadow: none;
    }

    .correction-box {
      margin-top: 10px;
      border-top: 1px solid var(--md-sys-color-outline-variant);
      padding-top: 14px;
    }

    /* END SCREEN */
    .winner-banner {
      text-align: center;
      padding: 16px 0;
    }

    .winner-banner .trophy {
      font-size: 3.2rem;
      margin-bottom: 8px;
    }

    .winner-banner h2 {
      font-size: 1.75rem;
      color: var(--md-sys-color-primary);
    }

    .ranking-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 18px 0;
    }

    .ranking-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-radius: var(--md-sys-shape-corner-md);
      background-color: var(--md-sys-color-surface-container-low);
      border: 1px solid var(--md-sys-color-outline-variant);
    }

    .ranking-item.winner {
      border-color: var(--md-sys-color-warning);
      background-color: var(--md-sys-color-warning-container);
      color: var(--md-sys-color-on-warning-container);
    }

    .rank-num {
      font-weight: 700;
      font-size: 1.08rem;
      width: 30px;
    }

    .rank-name {
      flex: 1;
      font-weight: 700;
    }

    .rank-score {
      font-size: 1.25rem;
      font-weight: 700;
    }
  </style>
</head>
<body>

<div class="container">
  <header class="m3-top-app-bar">
    <a href="../index.html" class="m3-nav-btn" aria-label="Hauptmenü" title="Hauptmenü">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    </a>
    <div class="m3-top-app-bar-title-group">
      <h1 class="m3-top-app-bar-title">Qwirkle</h1>
      <p class="m3-top-app-bar-subtitle">Digitaler Punktehelfer</p>
    </div>
    <button type="button" class="m3-icon-btn" onclick="toggleTheme()" aria-label="Darstellung umschalten" title="Light/Dark Mode umschalten">
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 0 0 0-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
    </button>
  </header>

  <!-- STEP 1: SETUP SCREEN -->
  <div id="setup-screen" class="card">
    <h2 class="card-title">Spieler hinzufügen</h2>
    <div class="input-group">
      <input type="text" id="player-name-input" placeholder="Name eingeben..." autocomplete="off">
      <button type="button" class="btn-add" id="add-player-btn" title="Spieler hinzufügen" aria-label="Spieler hinzufügen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </div>
    <div id="t-player-chips"></div>

    <div class="player-setup-list" id="player-setup-list">
      <!-- Dynamisch hinzugefügte Spieler -->
    </div>

    <button class="btn" id="start-game-btn" disabled>Spiel starten</button>
  </div>

  <!-- STEP 2: GAME SCREEN -->
  <div id="game-screen" class="hidden">
    <!-- Punktestand Übersicht -->
    <div class="scoreboard" id="scoreboard">
      <!-- Dynamische Spielerkarten -->
    </div>

    <!-- Eingabe-Bereich für aktiven Spieler -->
    <div class="card">
      <div class="active-player-header">
        Am Zug: <span id="active-player-name">-</span>
      </div>

      <!-- 1. Manuelle Punkteingabe -->
      <form id="score-form" onsubmit="event.preventDefault(); addManualPoints();">
        <div class="points-input-box">
          <input type="number" id="points-input" min="0" placeholder="Punkte" inputmode="numeric" pattern="[0-9]*">
          <button type="submit" class="btn" style="width: 140px;">Eintragen</button>
        </div>
      </form>

      <!-- Schnellaktionen -->
      <div class="action-grid">
        <!-- 2. Qwirkle -->
        <button class="btn btn-qwirkle" onclick="addQwirkle()">
          ⚡ Qwirkle! (+12 Pkt)
        </button>

        <!-- 3. Steine tauschen -->
        <button class="btn btn-swap" onclick="swapStones()">
          🔄 Steine tauschen (0 Pkt)
        </button>

        <!-- 4. Spielende -->
        <button class="btn btn-end-game" onclick="endGame()">
          🏁 Spielende (+6 Pkt & Auswertung)
        </button>
      </div>

      <!-- Korrektur Button -->
      <div class="correction-box">
        <button class="btn btn-outline" id="undo-btn" onclick="undo()" disabled>
          ↩️ Letzte Eingabe korrigieren
        </button>
      </div>
    </div>
  </div>

  <!-- STEP 3: END SCREEN -->
  <div id="end-screen" class="card hidden">
    <div class="winner-banner">
      <div class="trophy">🏆</div>
      <p style="color: var(--md-sys-color-on-surface-variant); text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px;">Sieger</p>
      <h2 id="winner-name">Spieler</h2>
    </div>

    <h3 class="card-title" style="font-size: 1rem; color: var(--md-sys-color-on-surface-variant); margin-bottom: 8px;">Endabrechnung</h3>
    <div class="ranking-list" id="ranking-list">
      <!-- Dynamische Rangliste -->
    </div>

    <div id="t-save-container" class="t-save-wrapper"></div>

    <div style="display: flex; gap: 10px; margin-top: 12px;">
      <button class="btn" onclick="restartWithSamePlayers()">Neu starten</button>
      <button class="btn btn-secondary" onclick="resetToSetup()">Neue Spieler</button>
    </div>
  </div>
</div>

<script>

  // Game State
  let players = []; // { name: string, score: number }
  let activePlayerIndex = 0;
  let history = []; // Für Undo-Funktionalität

  // DOM Elements
  const setupScreen = document.getElementById('setup-screen');
  const gameScreen = document.getElementById('game-screen');
  const endScreen = document.getElementById('end-screen');

  const playerNameInput = document.getElementById('player-name-input');
  const addPlayerBtn = document.getElementById('add-player-btn');
  const playerSetupList = document.getElementById('player-setup-list');
  const startGameBtn = document.getElementById('start-game-btn');

  const scoreboard = document.getElementById('scoreboard');
  const activePlayerName = document.getElementById('active-player-name');
  const pointsInput = document.getElementById('points-input');
  const undoBtn = document.getElementById('undo-btn');

  const winnerName = document.getElementById('winner-name');
  const rankingList = document.getElementById('ranking-list');

  // Event Listeners for Setup
  addPlayerBtn.addEventListener('click', addPlayer);
  playerNameInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') addPlayer();
  });
  startGameBtn.addEventListener('click', startGame);

  function addPlayer() {
    const name = playerNameInput.value.trim();
    if (name === '') return;

    players.push({ name: name, score: 0 });
    playerNameInput.value = '';
    renderSetupList();
  }

  function removePlayer(index) {
    players.splice(index, 1);
    renderSetupList();
  }

  function renderSetupList() {
    playerSetupList.innerHTML = '';
    players.forEach((p, idx) => {
      const item = document.createElement('div');
      item.className = 'player-setup-item';
      item.innerHTML = `
        <span><strong>${idx + 1}.</strong> ${p.name}</span>
        <button class="btn-remove" onclick="removePlayer(${idx})">✕</button>
      `;
      playerSetupList.appendChild(item);
    });

    startGameBtn.disabled = players.length === 0;
    renderTournamentChips();
  }

  function renderTournamentChips() {
    if (!window.Tournament) return;
    Tournament.renderPlayerChips('t-player-chips', {
      isSelected: (name) => players.some(p => p.name.toLowerCase() === name.toLowerCase()),
      onToggle: (name) => {
        const idx = players.findIndex(p => p.name.toLowerCase() === name.toLowerCase());
        if (idx >= 0) players.splice(idx, 1);
        else players.push({ name: name, score: 0 });
        renderSetupList();
      }
    });
  }

  function startGame() {
    if (players.length === 0) return;
    history = [];
    activePlayerIndex = 0;

    setupScreen.classList.add('hidden');
    endScreen.classList.add('hidden');
    gameScreen.classList.remove('hidden');

    renderGame();
  }

  // Save State for Undo
  function saveState() {
    history.push({
      players: JSON.parse(JSON.stringify(players)),
      activePlayerIndex: activePlayerIndex
    });
    undoBtn.disabled = false;
  }

  function undo() {
    if (history.length === 0) return;
    const prevState = history.pop();
    players = prevState.players;
    activePlayerIndex = prevState.activePlayerIndex;

    if (history.length === 0) {
      undoBtn.disabled = true;
    }

    renderGame();
  }

  // Turn Actions
  function addManualPoints() {
    const val = parseInt(pointsInput.value, 10);
    if (isNaN(val) || val < 0) return;

    saveState();
    players[activePlayerIndex].score += val;
    pointsInput.value = '';
    nextTurn();
  }

  function addQwirkle() {
    saveState();
    players[activePlayerIndex].score += 12; // 6 Steine + 6 Bonus
    nextTurn();
  }

  function swapStones() {
    saveState();
    // 0 Punkte
    nextTurn();
  }

  function endGame() {
    saveState();
    // Der Spieler, der das Spiel beendet, erhält 6 Zusatzpunkte
    players[activePlayerIndex].score += 6;

    showEndScreen();
  }

  function nextTurn() {
    activePlayerIndex = (activePlayerIndex + 1) % players.length;
    renderGame();
  }

  // Render Engine
  function renderGame() {
    activePlayerName.textContent = players[activePlayerIndex].name;

    // Höchsten Punktestand ermitteln
    const maxScore = Math.max(...players.map(p => p.score));

    scoreboard.innerHTML = '';
    players.forEach((p, idx) => {
      const isLeader = p.score === maxScore && maxScore > 0;
      const diff = p.score - maxScore;

      const card = document.createElement('div');
      card.className = `player-card ${idx === activePlayerIndex ? 'active' : ''}`;
      
      card.innerHTML = `
        ${isLeader ? '<div class="crown-icon">👑</div>' : ''}
        <div class="player-name">${p.name}</div>
        <div class="player-score">${p.score}</div>
        <div class="player-diff">${isLeader ? 'Führung' : (diff + ' Pkt')}</div>
      `;
      scoreboard.appendChild(card);
    });

    pointsInput.focus();
  }

  function showEndScreen() {
    gameScreen.classList.add('hidden');
    endScreen.classList.remove('hidden');

    // Sortieren nach Punkten absteigend
    const rankedPlayers = [...players].sort((a, b) => b.score - a.score);
    const topScore = rankedPlayers[0].score;

    // Gewinner ermitteln (auch mehrere bei Gleichstand)
    const winners = rankedPlayers.filter(p => p.score === topScore);
    winnerName.textContent = winners.map(w => w.name).join(' & ');

    rankingList.innerHTML = '';
    rankedPlayers.forEach((p, idx) => {
      const isWinner = p.score === topScore;
      const item = document.createElement('div');
      item.className = `ranking-item ${isWinner ? 'winner' : ''}`;
      item.innerHTML = `
        <div class="rank-num">${isWinner ? '👑' : (idx + 1) + '.'}</div>
        <div class="rank-name">${p.name}</div>
        <div class="rank-score">${p.score} Pkt</div>
      `;
      rankingList.appendChild(item);
    });

    if (tSaveCtrl) tSaveCtrl.reset();
  }

  function restartWithSamePlayers() {
    players.forEach(p => p.score = 0);
    startGame();
  }

  function resetToSetup() {
    players = [];
    renderSetupList();
    endScreen.classList.add('hidden');
    setupScreen.classList.remove('hidden');
  }

  const tSaveCtrl = window.Tournament ? Tournament.mountSaveButton('t-save-container', {
    gameName: 'Qwirkle',
    lowerIsBetter: false,
    getEntries: () => players.map(p => ({ name: p.name, score: p.score }))
  }) : null;

  renderTournamentChips();
</script>

</body>
</html>
