<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tutto Assistant</title>
    <link rel="stylesheet" href="../styles.css">
    <script>
        (function() {
            function updateLinks(theme) {
                document.querySelectorAll('a[href]').forEach(function(link) {
                    const raw = link.getAttribute('href');
                    if (!raw || raw.startsWith('#') || raw.startsWith('javascript:')) return;
                    link.setAttribute('href', raw.split('#')[0] + '#theme=' + theme);
                });
            }
            function applyTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                try { localStorage.setItem('spiele_theme', theme); } catch (e) {}
                try { window.name = 'spiele_theme:' + theme; } catch (e) {}
                try { history.replaceState(null, '', location.pathname + location.search + '#theme=' + theme); } catch (e) {}
                updateLinks(theme);
            }
            function getInitialTheme() {
                const hashMatch = (location.hash || '').match(/theme=(dark|light)/);
                if (hashMatch) return hashMatch[1];
                const nameMatch = (window.name || '').match(/spiele_theme:(dark|light)/);
                if (nameMatch) return nameMatch[1];
                try {
                    const saved = localStorage.getItem('spiele_theme');
                    if (saved === 'dark' || saved === 'light') return saved;
                } catch (e) {}
                return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
            }
            applyTheme(getInitialTheme());
            window.addEventListener('DOMContentLoaded', function() {
                applyTheme(document.documentElement.getAttribute('data-theme') || 'dark');
            });
            window.addEventListener('pageshow', function() {
                const nameMatch = (window.name || '').match(/spiele_theme:(dark|light)/);
                if (nameMatch) { applyTheme(nameMatch[1]); return; }
                try {
                    const saved = localStorage.getItem('spiele_theme');
                    if (saved === 'dark' || saved === 'light') applyTheme(saved);
                } catch (err) {}
            });
            window.addEventListener('storage', function(e) {
                if (e.key === 'spiele_theme' && (e.newValue === 'dark' || e.newValue === 'light')) {
                    applyTheme(e.newValue);
                }
            });
            document.addEventListener('click', function(e) {
                const link = e.target && e.target.closest ? e.target.closest('a[href]') : null;
                if (!link) return;
                const raw = link.getAttribute('href');
                if (!raw || raw.startsWith('#') || raw.startsWith('javascript:')) return;
                const theme = document.documentElement.getAttribute('data-theme') || 'dark';
                link.setAttribute('href', raw.split('#')[0] + '#theme=' + theme);
            }, true);
            window.toggleTheme = function() {
                const current = document.documentElement.getAttribute('data-theme') || 'dark';
                applyTheme(current === 'dark' ? 'light' : 'dark');
            };
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        .container {
            width: 100%;
            max-width: 520px;
        }

        .input-group input[type="text"] { flex-grow: 1; }
        input[type="number"] { width: 100%; text-align: center; font-weight: bold; font-size: 1.2rem; }

        .btn-primary { 
            width: 100%; 
            padding: 15px;
            font-size: 1.05rem;
            margin-top: 14px;
        }
        
        .btn-undo {
            width: 100%;
            margin-top: 12px;
        }

        /* Spezial-Aktionen Grid */
        .special-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 14px;
        }

        .btn-special {
            padding: 12px 10px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border-radius: var(--md-sys-shape-corner-md);
            background-color: var(--md-sys-color-surface-container-high);
            border: 1px solid var(--md-sys-color-outline-variant);
            color: var(--md-sys-color-on-surface);
        }

        .btn-kleeblatt {
            background-color: var(--md-sys-color-tertiary-container);
            border-color: var(--md-sys-color-tertiary);
            color: var(--md-sys-color-on-tertiary-container);
        }
        .btn-strasse {
            background-color: var(--md-sys-color-primary-container);
            border-color: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary-container);
        }
        .btn-plusminus {
            background-color: var(--md-sys-color-purple-container);
            border-color: var(--md-sys-color-purple);
            color: var(--md-sys-color-on-purple-container);
        }
        .btn-double {
            background-color: var(--md-sys-color-warning-container);
            border-color: var(--md-sys-color-warning);
            color: var(--md-sys-color-on-warning-container);
        }

        /* Aktiver Spieler Highlights */
        .active-player-header {
            text-align: center;
            margin-bottom: 15px;
        }

        .active-badge {
            background-color: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            font-size: 0.75rem;
            font-weight: 800;
            padding: 5px 14px;
            border-radius: var(--md-sys-shape-corner-full);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-block;
            margin-bottom: 8px;
        }

        .active-name {
            font-size: 1.8rem;
            font-weight: 800;
            margin: 0;
        }

        .active-stats {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--md-sys-color-outline-variant);
        }

        .stat-item { text-align: center; }
        .stat-val { font-size: 1.35rem; font-weight: 800; color: var(--md-sys-color-primary); }
        .stat-lbl { font-size: 0.75rem; color: var(--md-sys-color-on-surface-variant); text-transform: uppercase; }

        /* Spielerliste */
        .player-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            background-color: var(--md-sys-color-surface-container);
            padding: 14px 16px;
            border-radius: var(--md-sys-shape-corner-lg);
            border: 1px solid var(--md-sys-color-outline-variant);
        }

        .player-card.is-active {
            border-color: var(--md-sys-color-primary);
            background-color: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
        }

        .player-card.is-leader {
            border-color: var(--md-sys-color-warning);
        }

        .player-name { font-weight: 700; font-size: 1.05rem; }
        .player-score { font-weight: 800; color: var(--md-sys-color-primary); font-size: 1.15rem; }
        .player-card.is-active .player-score { color: var(--md-sys-color-on-primary-container); }

        .final-banner {
            background-color: var(--md-sys-color-error-container);
            border: 1px solid var(--md-sys-color-error);
            color: var(--md-sys-color-on-error-container);
            padding: 12px 16px;
            border-radius: var(--md-sys-shape-corner-lg);
            text-align: center;
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 15px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.65; }
        }

        .modal-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        .setup-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--md-sys-color-surface-container);
            padding: 10px 14px;
            border-radius: var(--md-sys-shape-corner-md);
            border: 1px solid var(--md-sys-color-outline-variant);
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <header class="m3-top-app-bar">
        <a href="../index.html" class="m3-nav-btn" aria-label="Hauptmenü" title="Hauptmenü">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        </a>
        <div class="m3-top-app-bar-title-group">
            <h1 class="m3-top-app-bar-title">Tutto</h1>
            <p class="m3-top-app-bar-subtitle">Ziel: 6000 Punkte</p>
        </div>
        <button type="button" class="m3-icon-btn" onclick="toggleTheme()" aria-label="Darstellung umschalten" title="Light/Dark Mode umschalten">
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 0 0 0-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
        </button>
    </header>

    <!-- SETUP SCREEN -->
    <div id="setupScreen" class="card">
        <h3 class="card-title">Spieler hinzufügen</h3>
        <div class="input-group">
            <input type="text" id="playerNameInput" placeholder="Name eingeben..." onkeypress="if(event.key==='Enter') addPlayer()">
            <button class="btn-add" onclick="addPlayer()">+</button>
        </div>
        <div id="setupPlayerList" style="margin-top: 15px;"></div>
        <button id="startGameBtn" class="btn-primary" style="display:none;" onclick="startGame()">Spiel starten</button>
    </div>

    <!-- GAME SCREEN -->
    <div id="gameScreen" style="display:none;">
        
        <div id="finalRoundBanner" class="final-banner" style="display:none;">
            ⚠️ Letzte Runde! Alle anderen Spieler haben noch 1 Versuch.
        </div>

        <!-- Aktiver Spieler Card -->
        <div class="card">
            <div class="active-player-header">
                <span class="active-badge" id="activeRoundBadge">Runde 1</span>
                <h2 class="active-name" id="activePlayerName">-</h2>
            </div>

            <div class="active-stats">
                <div class="stat-item">
                    <div class="stat-val" id="activePlayerScore">0</div>
                    <div class="stat-lbl">Punkte</div>
                </div>
                <div class="stat-item">
                    <div class="stat-val" id="activePlayerDiff">6000</div>
                    <div class="stat-lbl">Bis Ziel</div>
                </div>
                <div class="stat-item">
                    <div class="stat-val" id="activePlayerRounds">0</div>
                    <div class="stat-lbl">Züge</div>
                </div>
            </div>

            <div style="margin-top: 20px;">
                <input type="number" id="scoreInput" placeholder="Punkte der Runde" inputmode="numeric" onfocus="this.select()">
                <button class="btn-primary" onclick="submitScore()">Punkte eintragen</button>

                <!-- Spezial Aktionen -->
                <div class="special-grid">
                    <button class="btn-special btn-kleeblatt" onclick="askKleeblatt()">🍀 Kleeblatt</button>
                    <button class="btn-special btn-strasse" onclick="handleStrasse()">🛣️ Straße (+2000)</button>
                    <button class="btn-special btn-plusminus" onclick="handlePlusMinus()">⚖️ +/- (+1000)</button>
                    <button class="btn-special btn-double" onclick="handleDouble()">👯 Verdoppeln</button>
                </div>

                <button id="undoBtn" class="btn-undo" onclick="undoLastAction()" style="display:none;">↩ Korrigieren</button>
            </div>
        </div>

        <!-- Übersicht / Scoreboard -->
        <div class="card">
            <h3 class="card-title" style="margin-top:0; margin-bottom:15px; font-size: 1.05rem; color: var(--md-sys-color-on-surface-variant);">Punktestand</h3>
            <div id="leaderboardList"></div>
        </div>
    </div>

    <!-- HIGHSCORE SCREEN -->
    <div id="highscoreScreen" class="card" style="display:none;">
        <h2 style="text-align: center; margin-top: 0; color: var(--md-sys-color-primary);">🏆 Highscore</h2>
        <p style="text-align: center; color: var(--md-sys-color-on-surface-variant); font-size: 0.85rem; margin-bottom: 16px;">Gewonnene Runden</p>
        <div id="highscoreList"></div>
        <button class="btn-primary" onclick="startNextRoundSamePlayers()" style="margin-top: 20px;">🔄 Nächste Runde (Gleiche Spieler)</button>
        <button class="btn-undo" onclick="resetEntireGame()" style="margin-top: 10px;">Neues Spiel (Neue Spieler)</button>
    </div>
</div>

<!-- KLEEBLATT MODAL -->
<div id="kleeblattModal" class="modal-overlay" style="display:none;">
    <div class="modal-content">
        <h2>🍀 Kleeblatt!</h2>
        <p style="color: var(--md-sys-color-on-surface-variant); margin: 12px 0 20px 0;">
            Bist du sicher, dass <strong id="kleeblattPlayerName" style="color: var(--md-sys-color-on-surface);"></strong> das Kleeblatt geschafft hat?
        </p>
        <div class="modal-actions">
            <button class="btn-primary" style="margin-top:0;" onclick="confirmKleeblatt()">Ja, Sofortgewinn!</button>
            <button class="btn-undo" onclick="closeModal('kleeblattModal')">Nein, weiter spielen</button>
        </div>
    </div>
</div>

<!-- GAME OVER MODAL -->
<div id="gameOverModal" class="modal-overlay" style="display:none;">
    <div class="modal-content">
        <h2>🎉 Spiel beendet!</h2>
        <p id="winnerAnnouncement" style="font-size: 1.1rem; margin: 12px 0 20px 0;"></p>
        <div class="modal-actions">
            <button class="btn-primary" style="margin-top:0;" onclick="startNextRoundSamePlayers()">Weitere Runde mit denselben Spielern</button>
            <button class="btn-special" style="padding: 14px; width: 100%; justify-content: center; border-radius: var(--md-sys-shape-corner-full);" onclick="showHighscore()">Highscore anzeigen</button>
            <button class="btn-undo" onclick="undoLastAction()">↩ Letzte Eingabe korrigieren</button>
        </div>
    </div>
</div>

<script>

    const TARGET_SCORE = 6000;
    let players = [];
    let currentPlayerIndex = 0;
    let currentRound = 1;
    let isFinalRound = false;
    let history = [];

    // --- SETUP FUNKTIONEN ---
    function addPlayer() {
        const input = document.getElementById('playerNameInput');
        const name = input.value.trim();
        if (name !== "") {
            players.push({ name: name, score: 0, roundsPlayed: 0, wins: 0 });
            input.value = "";
            renderSetupList();
        }
    }

    function removeSetupPlayer(index) {
        players.splice(index, 1);
        renderSetupList();
    }

    function renderSetupList() {
        const listDiv = document.getElementById('setupPlayerList');
        const startBtn = document.getElementById('startGameBtn');
        listDiv.innerHTML = "";

        players.forEach((p, idx) => {
            const item = document.createElement('div');
            item.className = 'setup-list-item';
            item.innerHTML = `
                <span>${p.name}</span>
                <span style="color: var(--md-sys-color-error); cursor: pointer; font-weight: bold;" onclick="removeSetupPlayer(${idx})">✕</span>
            `;
            listDiv.appendChild(item);
        });

        startBtn.style.display = players.length >= 1 ? 'inline-flex' : 'none';
    }

    function startGame() {
        document.getElementById('setupScreen').style.display = 'none';
        document.getElementById('gameScreen').style.display = 'block';
        currentPlayerIndex = 0;
        currentRound = 1;
        isFinalRound = false;
        history = [];
        renderGame();
    }

    // --- SPIEL LOGIK ---
    function saveHistory() {
        history.push(JSON.stringify({
            players: players,
            currentPlayerIndex: currentPlayerIndex,
            currentRound: currentRound,
            isFinalRound: isFinalRound
        }));
    }

    function undoLastAction() {
        if (history.length > 0) {
            const state = JSON.parse(history.pop());
            players = state.players;
            currentPlayerIndex = state.currentPlayerIndex;
            currentRound = state.currentRound;
            isFinalRound = state.isFinalRound;

            closeModal('gameOverModal');
            closeModal('kleeblattModal');
            document.getElementById('highscoreScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';

            renderGame();
        }
    }

    function submitScore() {
        const input = document.getElementById('scoreInput');
        const val = parseInt(input.value) || 0;
        applyPointsAndAdvance(val);
        input.value = "";
    }

    function handleStrasse() {
        applyPointsAndAdvance(2000);
    }

    function handleDouble() {
        const input = document.getElementById('scoreInput');
        const val = parseInt(input.value) || 0;
        applyPointsAndAdvance(val * 2);
        input.value = "";
    }

    function handlePlusMinus() {
        saveHistory();
        const activePlayer = players[currentPlayerIndex];
        const maxScore = Math.max(...players.map(p => p.score));

        // Eigener Spieler bekommt +1000
        activePlayer.score += 1000;

        // Prüfen ob der eigene Spieler VOR dieser Aktion Führender war
        const isLeader = activePlayer.score - 1000 === maxScore;

        if (!isLeader) {
            // Allen Führenden 1000 Punkte abziehen
            players.forEach((p, idx) => {
                if (idx !== currentPlayerIndex && p.score === maxScore) {
                    p.score = Math.max(0, p.score - 1000);
                }
            });
        }

        advanceTurn();
    }

    function askKleeblatt() {
        document.getElementById('kleeblattPlayerName').innerText = players[currentPlayerIndex].name;
        document.getElementById('kleeblattModal').style.display = 'flex';
    }

    function confirmKleeblatt() {
        closeModal('kleeblattModal');
        saveHistory();
        
        const activePlayer = players[currentPlayerIndex];
        activePlayer.score = Math.max(activePlayer.score, TARGET_SCORE);
        activePlayer.wins += 1;
        
        triggerWinScreen(`${activePlayer.name} hat mit dem Kleeblatt sofort gewonnen! 🍀`);
    }

    function applyPointsAndAdvance(points) {
        saveHistory();
        players[currentPlayerIndex].score += points;
        advanceTurn();
    }

    function advanceTurn() {
        const activePlayer = players[currentPlayerIndex];
        activePlayer.roundsPlayed += 1;

        // Zielpunktzahl erreicht Check
        if (activePlayer.score >= TARGET_SCORE) {
            isFinalRound = true;
        }

        // Nächster Spieler
        currentPlayerIndex = (currentPlayerIndex + 1) % players.length;

        // Rundenabschluss
        if (currentPlayerIndex === 0) {
            if (isFinalRound) {
                endGame();
                return;
            }
            currentRound++;
        }

        renderGame();
    }

    function endGame() {
        // Höchste Punktzahl finden
        const maxScore = Math.max(...players.map(p => p.score));
        const winners = players.filter(p => p.score === maxScore);

        winners.forEach(w => w.wins += 1);

        let msg = "";
        if (winners.length === 1) {
            msg = `<strong style="color: var(--md-sys-color-primary); font-size: 1.4rem;">${winners[0].name}</strong> gewinnt mit <strong>${winners[0].score}</strong> Punkten!`;
        } else {
            msg = `Unentschieden! <strong style="color: var(--md-sys-color-primary);">${winners.map(w => w.name).join(', ')}</strong> gewinnen mit je ${maxScore} Punkten!`;
        }

        triggerWinScreen(msg);
    }

    function triggerWinScreen(messageHtml) {
        shootConfetti();
        document.getElementById('winnerAnnouncement').innerHTML = messageHtml;
        document.getElementById('gameOverModal').style.display = 'flex';
    }

    // --- RENDER FUNKTIONEN ---
    function renderGame() {
        const activePlayer = players[currentPlayerIndex];
        const diff = TARGET_SCORE - activePlayer.score;

        document.getElementById('activeRoundBadge').innerText = `Runde ${currentRound}`;
        document.getElementById('activePlayerName').innerText = activePlayer.name;
        document.getElementById('activePlayerScore').innerText = activePlayer.score;
        document.getElementById('activePlayerDiff').innerText = diff > 0 ? diff : 0;
        document.getElementById('activePlayerRounds').innerText = activePlayer.roundsPlayed;

        document.getElementById('finalRoundBanner').style.display = isFinalRound ? 'block' : 'none';
        document.getElementById('undoBtn').style.display = history.length > 0 ? 'inline-flex' : 'none';

        // Board rendern
        const boardList = document.getElementById('leaderboardList');
        boardList.innerHTML = "";

        const maxScore = Math.max(...players.map(p => p.score));

        players.forEach((p, idx) => {
            const isActive = idx === currentPlayerIndex;
            const isLeader = p.score === maxScore && maxScore > 0;

            const card = document.createElement('div');
            card.className = `player-card ${isActive ? 'is-active' : ''} ${isLeader ? 'is-leader' : ''}`;
            card.innerHTML = `
                <div>
                    ${isLeader ? '👑 ' : ''}
                    <span class="player-name">${p.name}</span>
                    <span style="font-size: 0.8rem; opacity: 0.75; margin-left: 6px;">(${p.roundsPlayed} Züge)</span>
                </div>
                <div class="player-score">${p.score}</div>
            `;
            boardList.appendChild(card);
        });
    }

    function showHighscore() {
        closeModal('gameOverModal');
        document.getElementById('gameScreen').style.display = 'none';
        document.getElementById('setupScreen').style.display = 'none';
        
        const hsScreen = document.getElementById('highscoreScreen');
        const hsList = document.getElementById('highscoreList');
        hsScreen.style.display = 'block';

        const sorted = [...players].sort((a, b) => b.wins - a.wins);

        hsList.innerHTML = sorted.map((p, idx) => `
            <div class="player-card">
                <div>
                    <span class="player-name">${idx === 0 && p.wins > 0 ? '👑 ' : ''}${p.name}</span>
                </div>
                <div style="font-weight: 800; color: var(--md-sys-color-primary); font-size: 1.1rem;">
                    ${p.wins} ${p.wins === 1 ? 'Sieg' : 'Siege'}
                </div>
            </div>
        `).join('');
    }

    function startNextRoundSamePlayers() {
        players.forEach(p => {
            p.score = 0;
            p.roundsPlayed = 0;
        });
        closeModal('gameOverModal');
        document.getElementById('highscoreScreen').style.display = 'none';
        startGame();
    }

    function resetEntireGame() {
        players = [];
        history = [];
        closeModal('gameOverModal');
        document.getElementById('highscoreScreen').style.display = 'none';
        document.getElementById('gameScreen').style.display = 'none';
        document.getElementById('setupScreen').style.display = 'block';
        renderSetupList();
    }

    function closeModal(id) {
        document.getElementById(id).style.display = 'none';
    }

    function shootConfetti() {
        const duration = 3 * 1000;
        const end = Date.now() + duration;

        (function frame() {
            confetti({
                particleCount: 3,
                angle: 60,
                spread: 55,
                origin: { x: 0 },
                colors: ['#0b57d0', '#fbbc04', '#146c2e']
            });
            confetti({
                particleCount: 3,
                angle: 120,
                spread: 55,
                origin: { x: 1 },
                colors: ['#0b57d0', '#fbbc04', '#146c2e']
            });

            if (Date.now() < end) {
                requestAnimationFrame(frame);
            }
        }());
    }
</script>

</body>
