<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Minigolf Pro Tracker</title>
    <link rel="stylesheet" href="../styles.css">
    <script>
        (function() {
            function updateLinks(theme) {
                document.querySelectorAll('a[href]').forEach(function(link) {
                    const raw = link.getAttribute('href');
                    if (!raw || raw.startsWith('#') || raw.startsWith('javascript:')) return;
                    link.setAttribute('href', raw.split('#')[0] + '#theme=' + theme);
                });
            }
            function applyTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                try { localStorage.setItem('spiele_theme', theme); } catch (e) {}
                try { window.name = 'spiele_theme:' + theme; } catch (e) {}
                try { history.replaceState(null, '', location.pathname + location.search + '#theme=' + theme); } catch (e) {}
                updateLinks(theme);
            }
            function getInitialTheme() {
                const hashMatch = (location.hash || '').match(/theme=(dark|light)/);
                if (hashMatch) return hashMatch[1];
                const nameMatch = (window.name || '').match(/spiele_theme:(dark|light)/);
                if (nameMatch) return nameMatch[1];
                try {
                    const saved = localStorage.getItem('spiele_theme');
                    if (saved === 'dark' || saved === 'light') return saved;
                } catch (e) {}
                return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
            }
            applyTheme(getInitialTheme());
            window.addEventListener('DOMContentLoaded', function() {
                applyTheme(document.documentElement.getAttribute('data-theme') || 'dark');
            });
            window.addEventListener('pageshow', function() {
                const nameMatch = (window.name || '').match(/spiele_theme:(dark|light)/);
                if (nameMatch) { applyTheme(nameMatch[1]); return; }
                try {
                    const saved = localStorage.getItem('spiele_theme');
                    if (saved === 'dark' || saved === 'light') applyTheme(saved);
                } catch (err) {}
            });
            window.addEventListener('storage', function(e) {
                if (e.key === 'spiele_theme' && (e.newValue === 'dark' || e.newValue === 'light')) {
                    applyTheme(e.newValue);
                }
            });
            document.addEventListener('click', function(e) {
                const link = e.target && e.target.closest ? e.target.closest('a[href]') : null;
                if (!link) return;
                const raw = link.getAttribute('href');
                if (!raw || raw.startsWith('#') || raw.startsWith('javascript:')) return;
                const theme = document.documentElement.getAttribute('data-theme') || 'dark';
                link.setAttribute('href', raw.split('#')[0] + '#theme=' + theme);
            }, true);
            window.toggleTheme = function() {
                const current = document.documentElement.getAttribute('data-theme') || 'dark';
                applyTheme(current === 'dark' ? 'light' : 'dark');
            };
        })();
    </script>
    <style>
        body {
            height: 100svh;
            padding: 0;
            overflow: hidden;
        }

        .app-shell {
            width: 100%;
            max-width: 640px;
            height: 100svh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .m3-top-app-bar {
            padding: calc(max(16px, env(safe-area-inset-top)) + 8px) 16px 20px 16px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        /* --- SETUP --- */
        #setup-screen {
            padding: 0 16px 20px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            flex: 1;
        }

        .card {
            width: 100%;
            max-width: 440px;
        }

        .input-group { display: flex; gap: 8px; margin-bottom: 15px; }
        .input-group input { flex-grow: 1; }

        .btn-add { width: 52px; font-size: 1.4rem; padding: 0; }
        .btn-start { width: 100%; padding: 15px; margin-top: 14px; }
        
        .player-tag {
            display: inline-flex;
            align-items: center;
            background-color: var(--md-sys-color-secondary-container);
            color: var(--md-sys-color-on-secondary-container);
            padding: 8px 14px;
            border-radius: var(--md-sys-shape-corner-full);
            margin: 4px;
            font-size: 0.9rem;
            font-weight: 600;
            border: 1px solid var(--md-sys-color-outline-variant);
            cursor: pointer;
        }
        .player-tag::after { content: '✕'; margin-left: 8px; font-size: 0.75rem; opacity: 0.7; }

        /* --- GAME --- */
        #game-screen { display: none; flex-direction: column; flex: 1; min-height: 0; }
        .table-container { 
            flex: 1; 
            overflow: auto; 
            padding: 0 12px 24px 12px; 
        }
        table { width: 100%; border-collapse: separate; border-spacing: 0; }
        thead th {
            position: sticky;
            top: 0;
            background-color: var(--md-sys-color-surface-container-high);
            z-index: 20;
            padding: 10px 6px;
            border-bottom: 2px solid var(--md-sys-color-primary);
            font-size: 0.75rem;
        }
        
        .score-val { font-size: 1.15rem; color: var(--md-sys-color-primary); display: block; font-weight: 800; }
        .progress-val { font-size: 0.65rem; color: var(--md-sys-color-on-surface-variant); }

        td {
            padding: 12px 6px;
            text-align: center;
            border-bottom: 1px solid var(--md-sys-color-outline-variant);
            background-color: var(--md-sys-color-surface-container-lowest);
            color: var(--md-sys-color-on-surface);
        }
        tr td:first-child {
            font-weight: bold;
            color: var(--md-sys-color-on-surface-variant);
            border-right: 1px solid var(--md-sys-color-outline-variant);
            background-color: var(--md-sys-color-surface-container-low);
            width: 44px;
        }

        .active-cell {
            background-color: var(--md-sys-color-primary-container) !important;
            color: var(--md-sys-color-on-primary-container) !important;
            box-shadow: inset 0 0 0 2px var(--md-sys-color-primary);
            font-weight: 800;
        }

        /* --- KEYPAD (M3 Bottom Sheet) --- */
        .keypad-container {
            background-color: var(--md-sys-color-surface-container);
            border-top: 1px solid var(--md-sys-color-outline-variant);
            padding: 14px 15px calc(20px + env(safe-area-inset-bottom));
            border-radius: 24px 24px 0 0;
            box-shadow: var(--md-sys-elevation-3);
            flex-shrink: 0;
            z-index: 30;
        }

        .turn-info { text-align: center; margin-bottom: 12px; font-size: 0.95rem; color: var(--md-sys-color-on-surface-variant); }
        .turn-info b { color: var(--md-sys-color-primary); font-size: 1.15rem; }

        .grid-pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 500px; margin: 0 auto; }
        .key {
            background-color: var(--md-sys-color-surface-container-highest);
            color: var(--md-sys-color-on-surface);
            border: 1px solid var(--md-sys-color-outline-variant);
            height: 68px;
            border-radius: var(--md-sys-shape-corner-lg);
            font-size: 1.45rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.12s ease, background-color 0.15s ease;
        }
        .key:active {
            background-color: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            transform: scale(0.95);
        }
        .key.back {
            background-color: var(--md-sys-color-error-container);
            color: var(--md-sys-color-on-error-container);
            border-color: var(--md-sys-color-error);
            font-size: 1.6rem;
        }

        /* --- RESULTS --- */
        #result-overlay { display: none; }
        
        .winner-row { 
            background-color: var(--md-sys-color-warning-container);
            color: var(--md-sys-color-on-warning-container);
            border: 2px solid var(--md-sys-color-warning); 
            padding: 18px; 
            border-radius: var(--md-sys-shape-corner-lg); 
            margin-bottom: 14px; 
        }
        
        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 14px;
            border-bottom: 1px solid var(--md-sys-color-outline-variant);
            font-size: 1.05rem;
            align-items: center;
        }
        .result-item:last-of-type { border-bottom: none; }
        
        #confetti-container { position: absolute; inset: 0; pointer-events: none; z-index: 105; overflow: hidden; }
        .confetti { position: absolute; width: 10px; height: 10px; border-radius: 2px; opacity: 0; }
        @keyframes cannonLeft { 0% { transform: translate(-10vw, 100vh) rotate(0); opacity: 1; } 100% { transform: translate(110vw, -10vh) rotate(720deg); opacity: 0; } }
        @keyframes cannonRight { 0% { transform: translate(110vw, 100vh) rotate(0); opacity: 1; } 100% { transform: translate(-10vw, -10vh) rotate(720deg); opacity: 0; } }
    </style>
</head>
<body>

<div class="app-shell">
    <header class="m3-top-app-bar">
        <a href="../index.html" class="m3-nav-btn" aria-label="Hauptmenü" title="Hauptmenü">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        </a>
        <div class="m3-top-app-bar-title-group">
            <h1 class="m3-top-app-bar-title">Minigolf</h1>
            <p class="m3-top-app-bar-subtitle">Digitaler Minigolf-Zettel</p>
        </div>
        <button type="button" class="m3-icon-btn" onclick="toggleTheme()" aria-label="Darstellung umschalten" title="Light/Dark Mode umschalten">
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 0 0 0-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
        </button>
    </header>

    <div id="setup-screen">
        <div class="card">
            <h3 class="card-title" style="margin-bottom: 4px;">Spieler hinzufügen</h3>
            <p style="font-size: 0.8rem; color: var(--md-sys-color-on-surface-variant); margin-bottom: 12px; text-align: center;">Klicke Namen zum Entfernen</p>
            <div class="input-group">
                <input type="text" id="player-input" placeholder="Name..." autocomplete="off">
                <button class="btn-add" onclick="addPlayer()">+</button>
            </div>
            <div id="player-list" style="min-height: 40px; margin-bottom: 15px; text-align: center;"></div>
            
            <h3 class="card-title" style="margin-top:10px; margin-bottom: 8px;">Anzahl Bahnen</h3>
            <input type="number" id="hole-count" value="18" min="1" max="36" style="width: 100%; text-align: center; font-weight: 700;">
            
            <button class="btn-start" onclick="startGame()">Spiel starten</button>
        </div>
    </div>

    <div id="game-screen">
        <div class="table-container"><table id="score-table"></table></div>
        <div class="keypad-container">
            <div class="turn-info">Bahn <span id="active-hole-label">1</span>: <b id="active-name-label">-</b></div>
            <div class="grid-pad">
                <div class="key" onclick="setScore(1)">1</div>
                <div class="key" onclick="setScore(2)">2</div>
                <div class="key" onclick="setScore(3)">3</div>
                <div class="key" onclick="setScore(4)">4</div>
                <div class="key" onclick="setScore(5)">5</div>
                <div class="key" onclick="setScore(6)">6</div>
                <div class="key" onclick="setScore(7)">7</div>
                <div class="key back" onclick="undoStep()">↩</div>
            </div>
        </div>
    </div>
</div>

<div id="result-overlay" class="modal-overlay">
    <div id="confetti-container"></div>
    <div class="result-card">
        <h2 style="margin-top:0; color: var(--md-sys-color-primary); font-size: 1.8rem;">Endergebnis 🏆</h2>
        <div id="final-list" style="margin: 20px 0;"></div>
        <button class="btn-start" onclick="location.reload()">Neues Spiel</button>
    </div>
</div>

<script>

    let players = [];
    let holes = 18;
    let scores = {};
    let curP = 0, curH = 1;
    let history = []; 

    function addPlayer() {
        const input = document.getElementById('player-input');
        const name = input.value.trim();
        if (name && !players.includes(name)) {
            players.push(name);
            scores[name] = {};
            renderSetupPlayers();
            input.value = '';
            input.focus();
        }
    }

    function removePlayer(name) {
        players = players.filter(p => p !== name);
        delete scores[name];
        renderSetupPlayers();
    }

    function renderSetupPlayers() {
        const container = document.getElementById('player-list');
        container.innerHTML = players.map(p => 
            `<span class="player-tag" onclick="removePlayer('${p}')">${p}</span>`
        ).join('');
    }

    function startGame() {
        if (players.length === 0) return alert("Bitte mindestens einen Spieler hinzufügen!");
        holes = parseInt(document.getElementById('hole-count').value) || 18;
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'flex';
        renderTable();
        updateDisplay();
    }

    function renderTable() {
        const table = document.getElementById('score-table');
        let html = `<thead><tr><th>Bahn</th>`;
        players.forEach(p => {
            let sum = 0, played = 0;
            for(let h=1; h<=holes; h++) { if(scores[p][h]) { sum += scores[p][h]; played++; } }
            html += `<th>${p}<br><span class="score-val">${sum}</span><span class="progress-val">${played}/${holes}</span></th>`;
        });
        html += `</tr></thead><tbody>`;
        for (let h = 1; h <= holes; h++) {
            html += `<tr><td>${h}</td>`;
            players.forEach((p, pIdx) => {
                const active = (pIdx === curP && h === curH) ? 'active-cell' : '';
                html += `<td class="${active}" onclick="selectCell(${pIdx}, ${h})">${scores[p][h] || ''}</td>`;
            });
            html += `</tr>`;
        }
        table.innerHTML = html + `</tbody>`;
        const active = document.querySelector('.active-cell');
        if (active) active.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function selectCell(pIdx, hIdx) {
        curP = pIdx; curH = hIdx;
        renderTable(); updateDisplay();
    }

    function setScore(num) {
        history.push({ p: curP, h: curH, oldVal: scores[players[curP]][curH] });
        scores[players[curP]][curH] = num;
        
        if (checkGameOver()) {
            renderTable();
            setTimeout(showResults, 500);
            return;
        }

        curP++;
        if (curP >= players.length) { curP = 0; curH++; }
        if (curH > holes) curH = holes;
        
        renderTable(); updateDisplay();
    }

    function undoStep() {
        if (history.length === 0) return;
        const last = history.pop();
        curP = last.p;
        curH = last.h;
        scores[players[curP]][curH] = last.oldVal || null;
        renderTable();
        updateDisplay();
    }

    function checkGameOver() {
        return players.every(p => {
            for(let h=1; h<=holes; h++) { if(!scores[p][h]) return false; }
            return true;
        });
    }

    function updateDisplay() {
        document.getElementById('active-name-label').innerText = players[curP];
        document.getElementById('active-hole-label').innerText = curH;
    }

    function showResults() {
        const results = players.map(p => {
            const total = Object.values(scores[p]).reduce((a, b) => a + (b || 0), 0);
            return { name: p, total };
        }).sort((a, b) => a.total - b.total);

        let resHtml = "";
        results.forEach((r, i) => {
            const isWinner = i === 0;
            resHtml += `
                <div class="result-item ${isWinner ? 'winner-row' : ''}">
                    <span>${isWinner ? '🏆 ' : (i+1)+'. '} <b>${r.name}</b></span>
                    <span><b>${r.total}</b> Schläge</span>
                </div>`;
        });
        
        document.getElementById('final-list').innerHTML = resHtml;
        document.getElementById('result-overlay').style.display = 'flex';
        createConfetti();
    }

    function createConfetti() {
        const container = document.getElementById('confetti-container');
        const colors = ['#f44336', '#e91e63', '#2196f3', '#4CAF50', '#FFC107', '#FF5722', '#9c27b0'];
        for (let i = 0; i < 130; i++) {
            const div = document.createElement('div');
            div.classList.add('confetti');
            div.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            div.style.animationName = Math.random() > 0.5 ? 'cannonLeft' : 'cannonRight';
            div.style.animationDuration = (Math.random() * 2 + 2) + 's';
            div.style.animationDelay = (Math.random() * 1.5) + 's';
            const size = (Math.random() * 7 + 5) + 'px';
            div.style.width = size; div.style.height = size;
            container.appendChild(div);
        }
    }

    document.getElementById('player-input').addEventListener('keypress', e => {
        if (e.key === 'Enter') addPlayer();
    });
</script>
</body>
</html>
