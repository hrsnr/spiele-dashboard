<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cabo Punktehelfer</title>
  <link rel="stylesheet" href="../styles.css">
  <script src="../theme.js"></script>
  <script src="../tournament.js"></script>
  <style>
    .container {
      width: 100%;
      max-width: 650px;
    }

    /* Buttons */
    .btn {
      width: 100%;
    }

    .btn-kamikaze {
      background-color: var(--md-sys-color-error-container);
      color: var(--md-sys-color-on-error-container);
      padding: 9px 14px;
      font-size: 0.84rem;
      border-radius: var(--md-sys-shape-corner-full);
      border: 1px solid var(--md-sys-color-error);
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      width: auto;
      box-shadow: none;
    }

    /* SETUP SCREEN */
    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .input-group input {
      flex: 1;
    }

    .player-setup-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
    }

    .player-setup-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--md-sys-color-surface-container-low);
      border: 1px solid var(--md-sys-color-outline-variant);
      padding: 10px 14px;
      border-radius: var(--md-sys-shape-corner-md);
    }

    .btn-remove {
      background: none;
      border: none;
      color: var(--md-sys-color-error);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px 8px;
      width: auto;
      box-shadow: none;
    }

    /* SCOREBOARD */
    .scoreboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .player-card {
      background-color: var(--md-sys-color-surface-container-lowest);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-sys-shape-corner-lg);
      padding: 14px 12px;
      text-align: center;
      position: relative;
      box-shadow: var(--md-sys-elevation-1);
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .player-card.lowest {
      border-color: var(--md-sys-color-tertiary);
      background-color: var(--md-sys-color-tertiary-container);
      color: var(--md-sys-color-on-tertiary-container);
    }

    .crown-icon {
      position: absolute;
      top: -10px;
      right: 8px;
      font-size: 1.25rem;
    }

    .player-name {
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-score {
      font-size: 1.7rem;
      font-weight: 700;
      color: var(--md-sys-color-primary);
    }

    .player-card.lowest .player-score {
      color: var(--md-sys-color-on-tertiary-container);
    }

    .player-badge {
      font-size: 0.74rem;
      color: var(--md-sys-color-tertiary);
      margin-top: 2px;
      font-weight: 600;
    }

    .player-card.lowest .player-badge {
      color: var(--md-sys-color-on-tertiary-container);
    }

    /* ROUND INPUT FORM */
    .round-input-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      background-color: var(--md-sys-color-surface-container-low);
      border: 1px solid var(--md-sys-color-outline-variant);
      padding: 10px 14px;
      border-radius: var(--md-sys-shape-corner-md);
    }

    .round-input-label {
      flex: 1;
      font-weight: 600;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .round-input-row input {
      width: 90px;
      flex: none;
      text-align: center;
      font-weight: 700;
    }

    /* HISTORY TABLE */
    .table-wrapper {
      overflow-x: auto;
      margin-top: 10px;
      border-radius: var(--md-sys-shape-corner-md);
      border: 1px solid var(--md-sys-color-outline-variant);
      background-color: var(--md-sys-color-surface-container-lowest);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      font-size: 0.88rem;
    }

    .reset-note {
      font-size: 0.72rem;
      color: var(--md-sys-color-warning);
      font-weight: 700;
      display: block;
    }

    /* END SCREEN */
    .winner-banner {
      text-align: center;
      padding: 16px 0;
    }

    .winner-banner .trophy {
      font-size: 3.2rem;
      margin-bottom: 8px;
    }

    .winner-banner h2 {
      font-size: 1.75rem;
      color: var(--md-sys-color-primary);
    }

    .ranking-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 18px 0;
    }

    .ranking-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-radius: var(--md-sys-shape-corner-md);
      background-color: var(--md-sys-color-surface-container-low);
      border: 1px solid var(--md-sys-color-outline-variant);
    }

    .ranking-item.winner {
      border-color: var(--md-sys-color-warning);
      background-color: var(--md-sys-color-warning-container);
      color: var(--md-sys-color-on-warning-container);
    }

    .rank-num {
      font-weight: 700;
      font-size: 1.08rem;
      width: 30px;
    }

    .rank-name {
      flex: 1;
      font-weight: 700;
    }

    .rank-score {
      font-size: 1.25rem;
      font-weight: 700;
    }
  </style>
</head>
<body>

<div class="container">
  <header class="m3-top-app-bar">
    <a href="../index.html" class="m3-nav-btn" aria-label="Hauptmenü" title="Hauptmenü">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    </a>
    <div class="m3-top-app-bar-title-group">
      <h1 class="m3-top-app-bar-title">Cabo</h1>
      <p class="m3-top-app-bar-subtitle">Digitaler Punktehelfer</p>
    </div>
    <button type="button" class="m3-icon-btn" onclick="toggleTheme()" aria-label="Darstellung umschalten" title="Light/Dark Mode umschalten">
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 0 0 0-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
    </button>
  </header>

  <!-- STEP 1: SETUP SCREEN -->
  <div id="setup-screen" class="card">
    <h2 class="card-title">Spieler hinzufügen</h2>
    <div class="input-group">
      <input type="text" id="player-name-input" placeholder="Name eingeben..." autocomplete="off">
      <button type="button" class="btn-add" id="add-player-btn" title="Spieler hinzufügen" aria-label="Spieler hinzufügen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </div>
    <div id="t-player-chips"></div>

    <div class="player-setup-list" id="player-setup-list">
      <!-- Dynamisch hinzugefügte Spieler -->
    </div>

    <button class="btn" id="start-game-btn" disabled>Spiel starten</button>
  </div>

  <!-- STEP 2: GAME SCREEN -->
  <div id="game-screen" class="hidden">
    <!-- Punktestand Übersicht -->
    <div class="scoreboard" id="scoreboard">
      <!-- Dynamische Spielerkarten -->
    </div>

    <!-- Eingabe für neue Runde -->
    <div class="card">
      <h3 class="card-title" id="round-title">Runde 1 eintragen</h3>
      
      <div id="round-inputs-container">
        <!-- Dynamische Eingabefelder für jeden Spieler -->
      </div>

      <button class="btn" onclick="finishRound()" style="margin-top: 10px;">
        ✅ Runde beendet
      </button>
    </div>

    <!-- Rundenübersicht -->
    <div class="card">
      <h3 class="card-title" style="font-size: 1rem; color: var(--md-sys-color-on-surface-variant); margin-bottom: 8px;">Rundenübersicht</h3>
      <div class="table-wrapper">
        <table id="history-table">
          <thead>
            <tr id="history-head-row">
              <th>Runde</th>
              <!-- Spieler-Namen Spalten -->
            </tr>
          </thead>
          <tbody id="history-body">
            <!-- Runden-Ergebnisse -->
          </tbody>
        </table>
      </div>
      <button class="btn btn-outline" id="undo-btn" onclick="undoLastRound()" style="margin-top: 16px;" disabled>
        ↩️ Letzte Runde korrigieren
      </button>
    </div>
  </div>

  <!-- STEP 3: END SCREEN -->
  <div id="end-screen" class="card hidden">
    <div class="winner-banner">
      <div class="trophy">🏆</div>
      <p style="color: var(--md-sys-color-on-surface-variant); text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px;" id="winner-label">Sieger</p>
      <h2 id="winner-name">Spieler</h2>
    </div>

    <h3 class="card-title" style="font-size: 1rem; color: var(--md-sys-color-on-surface-variant); margin-bottom: 8px;">Endabrechnung</h3>
    <div class="ranking-list" id="ranking-list">
      <!-- Dynamische Rangliste -->
    </div>

    <div id="t-save-container" class="t-save-wrapper"></div>

    <div style="display: flex; gap: 10px; margin-top: 12px;">
      <button class="btn" onclick="restartWithSamePlayers()">Neu starten</button>
      <button class="btn btn-secondary" onclick="resetToSetup()">Neue Spieler</button>
    </div>
  </div>
</div>

<script>
  // Game State
  let players = []; // Array von Strings ["Name 1", "Name 2"]
  let rounds = [];  // Array von Objekten: { rawScores: [n1, n2], totalsAfter: [t1, t2], resets: [bool1, bool2] }

  // DOM Elements
  const setupScreen = document.getElementById('setup-screen');
  const gameScreen = document.getElementById('game-screen');
  const endScreen = document.getElementById('end-screen');

  const playerNameInput = document.getElementById('player-name-input');
  const addPlayerBtn = document.getElementById('add-player-btn');
  const playerSetupList = document.getElementById('player-setup-list');
  const startGameBtn = document.getElementById('start-game-btn');

  const scoreboard = document.getElementById('scoreboard');
  const roundTitle = document.getElementById('round-title');
  const roundInputsContainer = document.getElementById('round-inputs-container');
  
  const historyHeadRow = document.getElementById('history-head-row');
  const historyBody = document.getElementById('history-body');
  const undoBtn = document.getElementById('undo-btn');

  const winnerName = document.getElementById('winner-name');
  const winnerLabel = document.getElementById('winner-label');
  const rankingList = document.getElementById('ranking-list');

  // Event Listeners for Setup
  addPlayerBtn.addEventListener('click', addPlayer);
  playerNameInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') addPlayer();
  });
  startGameBtn.addEventListener('click', startGame);

  function addPlayer() {
    const name = playerNameInput.value.trim();
    if (name === '') return;

    players.push(name);
    playerNameInput.value = '';
    renderSetupList();
  }

  function removePlayer(index) {
    players.splice(index, 1);
    renderSetupList();
  }

  function renderSetupList() {
    playerSetupList.innerHTML = '';
    players.forEach((p, idx) => {
      const item = document.createElement('div');
      item.className = 'player-setup-item';
      item.innerHTML = `
        <span><strong>${idx + 1}.</strong> ${p}</span>
        <button class="btn-remove" onclick="removePlayer(${idx})">✕</button>
      `;
      playerSetupList.appendChild(item);
    });

    startGameBtn.disabled = players.length === 0;
    renderTournamentChips();
  }

  function renderTournamentChips() {
    if (!window.Tournament) return;
    Tournament.renderPlayerChips('t-player-chips', {
      isSelected: (name) => players.some(p => p.toLowerCase() === name.toLowerCase()),
      onToggle: (name) => {
        const idx = players.findIndex(p => p.toLowerCase() === name.toLowerCase());
        if (idx >= 0) players.splice(idx, 1);
        else players.push(name);
        renderSetupList();
      }
    });
  }

  function startGame() {
    if (players.length === 0) return;
    rounds = [];

    setupScreen.classList.add('hidden');
    endScreen.classList.add('hidden');
    gameScreen.classList.remove('hidden');

    renderGame();
  }

  // Get current totals calculated round by round with exact 100-reset rule
  function getCurrentTotals() {
    let totals = players.map(() => 0);

    rounds.forEach(r => {
      totals = r.totalsAfter;
    });

    return totals;
  }

  function triggerKamikaze(targetIdx) {
    players.forEach((_, idx) => {
      const input = document.getElementById(`score-input-${idx}`);
      if (input) {
        input.value = (idx === targetIdx) ? 0 : 50;
      }
    });
  }

  function finishRound() {
    const rawScores = [];
    
    for (let i = 0; i < players.length; i++) {
      const input = document.getElementById(`score-input-${i}`);
      const val = parseInt(input.value, 10);
      if (isNaN(val)) {
        alert(`Bitte gib eine gültige Punktzahl für ${players[i]} ein.`);
        return;
      }
      rawScores.push(val);
    }

    // Previous totals
    const prevTotals = getCurrentTotals();
    const newTotals = [];
    const resets = [];

    // Calculate new totals and apply 100-point reset rule
    for (let i = 0; i < players.length; i++) {
      let scoreSum = prevTotals[i] + rawScores[i];
      if (scoreSum === 100) {
        scoreSum = 50; // Exact 100 points reduced to 50
        resets.push(true);
      } else {
        resets.push(false);
      }
      newTotals.push(scoreSum);
    }

    rounds.push({
      rawScores: rawScores,
      totalsAfter: newTotals,
      resets: resets
    });

    // Check if game ends (if any player has 101 or more points)
    const hasGameEnded = newTotals.some(score => score >= 101);

    if (hasGameEnded) {
      showEndScreen();
    } else {
      renderGame();
    }
  }

  function undoLastRound() {
    if (rounds.length > 0) {
      rounds.pop();
      renderGame();
    }
  }

  function renderGame() {
    const currentTotals = getCurrentTotals();
    const minScore = Math.min(...currentTotals);

    // 1. Render Scoreboard
    scoreboard.innerHTML = '';
    players.forEach((p, idx) => {
      const isLowest = currentTotals[idx] === minScore;
      const card = document.createElement('div');
      card.className = `player-card ${isLowest ? 'lowest' : ''}`;
      
      card.innerHTML = `
        ${isLowest ? '<div class="crown-icon">👑</div>' : ''}
        <div class="player-name">${p}</div>
        <div class="player-score">${currentTotals[idx]}</div>
        <div class="player-badge">${isLowest ? 'Niedrigste Pkt' : ''}</div>
      `;
      scoreboard.appendChild(card);
    });

    // 2. Render Round Inputs
    roundTitle.textContent = `Runde ${rounds.length + 1} eintragen`;
    roundInputsContainer.innerHTML = '';

    players.forEach((p, idx) => {
      const row = document.createElement('div');
      row.className = 'round-input-row';
      row.innerHTML = `
        <span class="round-input-label">${p}</span>
        <input type="number" id="score-input-${idx}" placeholder="Punkte" inputmode="numeric" pattern="[0-9]*">
        <button type="button" class="btn-kamikaze" onclick="triggerKamikaze(${idx})">🚀 Kamikaze</button>
      `;
      roundInputsContainer.appendChild(row);
    });

    // 3. Render History Table
    historyHeadRow.innerHTML = '<th>Runde</th>';
    players.forEach(p => {
      const th = document.createElement('th');
      th.textContent = p;
      historyHeadRow.appendChild(th);
    });

    historyBody.innerHTML = '';
    rounds.forEach((r, rIdx) => {
      const tr = document.createElement('tr');
      let html = `<td><strong>R${rIdx + 1}</strong></td>`;
      
      r.rawScores.forEach((s, pIdx) => {
        const isReset = r.resets[pIdx];
        html += `
          <td>
            +${s} 
            <small style="color: var(--md-sys-color-on-surface-variant);">(${r.totalsAfter[pIdx]})</small>
            ${isReset ? '<span class="reset-note">🎯 100➔50!</span>' : ''}
          </td>
        `;
      });
      tr.innerHTML = html;
      historyBody.appendChild(tr);
    });

    undoBtn.disabled = rounds.length === 0;
  }

  function showEndScreen() {
    gameScreen.classList.add('hidden');
    endScreen.classList.remove('hidden');

    const finalTotals = getCurrentTotals();
    const minScore = Math.min(...finalTotals);

    // Player Object List for Ranking
    const playerObjects = players.map((name, idx) => ({
      name: name,
      score: finalTotals[idx]
    }));

    // Sort ascending by score (lowest score wins)
    playerObjects.sort((a, b) => a.score - b.score);

    // Find winners (supports ties)
    const winners = playerObjects.filter(p => p.score === minScore);
    
    if (winners.length > 1) {
      winnerLabel.textContent = "Unentschieden! Sieger";
      winnerName.textContent = winners.map(w => w.name).join(' & ');
    } else {
      winnerLabel.textContent = "Sieger";
      winnerName.textContent = winners[0].name;
    }

    rankingList.innerHTML = '';
    playerObjects.forEach((p, idx) => {
      const isWinner = p.score === minScore;
      const item = document.createElement('div');
      item.className = `ranking-item ${isWinner ? 'winner' : ''}`;
      item.innerHTML = `
        <div class="rank-num">${isWinner ? '👑' : (idx + 1) + '.'}</div>
        <div class="rank-name">${p.name}</div>
        <div class="rank-score">${p.score} Pkt</div>
      `;
      rankingList.appendChild(item);
    });

    if (tSaveCtrl) tSaveCtrl.reset();
  }

  function restartWithSamePlayers() {
    startGame();
  }

  function resetToSetup() {
    players = [];
    rounds = [];
    renderSetupList();
    endScreen.classList.add('hidden');
    setupScreen.classList.remove('hidden');
  }

  const tSaveCtrl = window.Tournament ? Tournament.mountSaveButton('t-save-container', {
    gameName: 'Cabo',
    lowerIsBetter: true,
    getEntries: () => {
      const totals = getCurrentTotals();
      return players.map((name, idx) => ({ name, score: totals[idx] }));
    }
  }) : null;

  renderTournamentChips();
</script>

</body>
</html>
