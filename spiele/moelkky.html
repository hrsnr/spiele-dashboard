<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mölkky Score Master Pro</title>
    <link rel="stylesheet" href="../styles.css">
    <script src="../theme.js"></script>
    <script src="../tournament.js"></script>
    <style>
        /* Fixiertes Grundlayout gegen Springen */
        html, body { 
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            position: fixed;
        }

        .app-shell {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            width: 100%;
            max-width: 540px;
            margin: 0 auto;
            position: relative;
        }

        .m3-top-app-bar {
            width: calc(100% - 24px);
            margin: max(10px, env(safe-area-inset-top)) 12px 10px 12px;
            padding: 6px 8px;
            flex-shrink: 0;
        }

        .top-controls { 
            padding: 0 15px 8px;
            text-align: center;
            flex-shrink: 0;
        }
        
        .setup-card {
            display: inline-block;
            margin-bottom: 8px;
            padding: 10px 14px;
            background-color: var(--md-sys-color-surface-container-lowest);
            border: 1px solid var(--md-sys-color-outline-variant);
            border-radius: var(--md-sys-shape-corner-lg);
            box-shadow: var(--md-sys-elevation-1);
        }

        .setup-img { 
            display: block;
            width: 106px; 
            height: auto; 
            margin: 0 auto;
        }

        [data-theme="dark"] .setup-img {
            filter: invert(0.9) hue-rotate(180deg);
        }

        .admin-area { 
            display: flex;
            gap: 8px;
            background-color: var(--md-sys-color-surface-container-lowest);
            border: 1px solid var(--md-sys-color-outline-variant);
            padding: 8px;
            border-radius: var(--md-sys-shape-corner-lg);
            box-shadow: var(--md-sys-elevation-1);
        }

        .admin-area input[type="text"] {
            flex: 1;
            padding: 10px 14px;
        }
        .btn-add { width: 46px; font-size: 1.25rem; padding: 0; }
        .btn-undo { padding: 0 14px; width: auto; }

        /* Scroll-Bereich optimiert */
        #scrollContainer {
            flex: 1;
            overflow-y: auto;
            padding: 6px 15px 24px;
            -webkit-overflow-scrolling: touch;
        }

        .player-list { display: grid; gap: 8px; padding-bottom: 18px; }
        
        .player-card { 
            background-color: var(--md-sys-color-surface-container-lowest);
            padding: 13px 16px;
            border-radius: var(--md-sys-shape-corner-lg);
            box-shadow: var(--md-sys-elevation-1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--md-sys-color-outline-variant);
            transition: background-color 0.16s ease, border-color 0.16s ease;
            scroll-margin-top: 20px;
        }

        .player-card.active {
            border: 1.5px solid var(--md-sys-color-primary);
            background-color: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
        }
        .player-card.eliminated {
            background-color: var(--md-sys-color-error-container);
            color: var(--md-sys-color-on-error-container);
            border-color: var(--md-sys-color-error);
            opacity: 0.8;
        }
        .player-card.winner {
            background-color: var(--md-sys-color-warning-container);
            color: var(--md-sys-color-on-warning-container);
            border: 1.5px solid var(--md-sys-color-warning);
        }

        .player-info h3 { margin: 0; font-size: 1.05rem; font-weight: 700; text-align: left; }
        .player-stats { font-size: 0.8rem; opacity: 0.85; margin-top: 3px; display: flex; align-items: center; gap: 8px; }
        
        .miss-dots { display: flex; gap: 4px; }
        .dot { width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--md-sys-color-outline); }
        .dot.filled { background-color: var(--md-sys-color-error); border-color: var(--md-sys-color-error); }

        .score-big { font-size: 1.55rem; font-weight: 700; color: var(--md-sys-color-primary); }
        .player-card.active .score-big { color: var(--md-sys-color-on-primary-container); }
        .player-card.winner .score-big { color: var(--md-sys-color-on-warning-container); }

        /* Tastenfeld - M3 Bottom Sheet */
        .input-panel { 
            background-color: var(--md-sys-color-surface-container-lowest);
            padding: 12px 12px calc(18px + env(safe-area-inset-bottom)) 12px;
            border-top: 1px solid var(--md-sys-color-outline-variant);
            border-radius: 28px 28px 0 0;
            box-shadow: var(--md-sys-elevation-3);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            flex-shrink: 0;
            z-index: 100;
        }

        .panel-label { grid-column: span 4; text-align: center; font-weight: 600; margin-bottom: 4px; font-size: 0.86rem; color: var(--md-sys-color-on-surface-variant); }
        .num-btn { 
            background-color: var(--md-sys-color-surface-container-low);
            border: 1px solid var(--md-sys-color-outline-variant);
            box-shadow: none;
            padding: 11px 0; 
            border-radius: var(--md-sys-shape-corner-md);
            font-size: 1.08rem;
            font-weight: 700;
            color: var(--md-sys-color-on-surface);
            touch-action: manipulation;
        }
        .num-btn.zero {
            background-color: var(--md-sys-color-error-container);
            color: var(--md-sys-color-on-error-container);
            border-color: var(--md-sys-color-error);
        }
        .num-btn:active {
            background-color: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
        }
    </style>
</head>
<body>

<div class="app-shell">
    <header class="m3-top-app-bar">
        <a href="../index.html" class="m3-nav-btn" aria-label="Hauptmenü" title="Hauptmenü">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        </a>
        <div class="m3-top-app-bar-title-group">
            <h1 class="m3-top-app-bar-title">Mölkky</h1>
            <p class="m3-top-app-bar-subtitle">Ziel: Exakt 50 Punkte</p>
        </div>
        <button type="button" class="m3-icon-btn" onclick="toggleTheme()" aria-label="Darstellung umschalten" title="Light/Dark Mode umschalten">
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 0 0 0-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
        </button>
    </header>

    <div class="top-controls">
        <div class="setup-card">
            <img src="https://www.molkky.world/img/the-rules/molkky-formation.svg" alt="Mölkky" class="setup-img">
        </div>
        <div class="admin-area">
            <input type="text" id="playerName" placeholder="Spieler..." autocomplete="off" onkeypress="if(event.key==='Enter') addPlayer()">
            <button class="btn btn-add" onclick="addPlayer()">+</button>
            <button class="btn btn-undo" id="undoBtn" onclick="undo()" disabled>↩</button>
        </div>
    </div>

    <div id="scrollContainer">
        <div id="t-player-chips" style="margin-bottom: 12px;"></div>
        <div id="playerList" class="player-list"></div>
        <div id="moelkky-end-card" class="card hidden" style="margin-top: 8px; text-align: center;">
            <h3 class="card-title" style="margin-bottom: 8px;">🏆 Spiel beendet!</h3>
            <div id="t-save-container" class="t-save-wrapper"></div>
            <button type="button" class="btn btn-primary" onclick="resetMoelkkyRound()" style="width: 100%; margin-top: 8px;">🔄 Neue Runde (Gleiche Spieler)</button>
        </div>
    </div>

    <div id="inputPanel" class="input-panel" style="display: none;">
        <div class="panel-label">Wurf für <span id="currentPlayerName" style="color: var(--md-sys-color-primary); font-weight: 800;">...</span></div>
        <button class="num-btn zero" onclick="submitScore(0)">0</button>
        <button class="num-btn" onclick="submitScore(1)">1</button>
        <button class="num-btn" onclick="submitScore(2)">2</button>
        <button class="num-btn" onclick="submitScore(3)">3</button>
        <button class="num-btn" onclick="submitScore(4)">4</button>
        <button class="num-btn" onclick="submitScore(5)">5</button>
        <button class="num-btn" onclick="submitScore(6)">6</button>
        <button class="num-btn" onclick="submitScore(7)">7</button>
        <button class="num-btn" onclick="submitScore(8)">8</button>
        <button class="num-btn" onclick="submitScore(9)">9</button>
        <button class="num-btn" onclick="submitScore(10)">10</button>
        <button class="num-btn" onclick="submitScore(11)">11</button>
        <button class="num-btn" onclick="submitScore(12)">12</button>
    </div>
</div>

<script>

    let players = [];
    let history = [];
    let activeIndex = 0;

    function saveState() {
        history.push(JSON.stringify({players, activeIndex}));
        document.getElementById('undoBtn').disabled = false;
    }

    function undo() {
        if (history.length > 0) {
            const state = JSON.parse(history.pop());
            players = state.players;
            activeIndex = state.activeIndex;
            if (history.length === 0) document.getElementById('undoBtn').disabled = true;
            render();
            scrollToActive();
        }
    }

    function addPlayer() {
        const input = document.getElementById('playerName');
        if (!input.value.trim()) return;
        saveState();
        players.push({ name: input.value.trim(), score: 0, misses: 0, eliminated: false, winner: false });
        input.value = "";
        render();
    }

    function checkWinCondition() {
        const activePlayers = players.filter(p => !p.eliminated);
        if (activePlayers.length === 1 && players.length > 1) {
            activePlayers[0].winner = true;
            return true;
        }
        return players.some(p => p.winner);
    }

    function submitScore(points) {
        if (players.length === 0 || checkWinCondition()) return;
        saveState();
        const p = players[activeIndex];
        if (points === 0) {
            p.misses++;
            if (p.misses >= 3) p.eliminated = true;
        } else {
            p.misses = 0;
            p.score += points;
            if (p.score === 50) p.winner = true;
            else if (p.score > 50) p.score = 25;
        }
        if (!checkWinCondition()) nextTurn();
        render();
        scrollToActive();
    }

    function nextTurn() {
        const eligible = players.filter(p => !p.eliminated && !p.winner);
        if (eligible.length === 0) return;
        
        // Suche nächsten spielberechtigten Index
        let nextIdx = activeIndex;
        do {
            nextIdx = (nextIdx + 1) % players.length;
        } while (players[nextIdx].eliminated || players[nextIdx].winner);
        
        activeIndex = nextIdx;
    }

    function scrollToActive() {
        setTimeout(() => {
            const activeCard = document.querySelector('.player-card.active');
            if (activeCard) {
                activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }, 100);
    }

    let wasGameOver = false;

    function renderTournamentChips() {
        if (!window.Tournament) return;
        const chipsContainer = document.getElementById('t-player-chips');
        const canEditRoster = players.every(p => p.score === 0 && p.misses === 0 && !p.eliminated && !p.winner);
        chipsContainer.style.display = canEditRoster ? 'block' : 'none';
        if (!canEditRoster) return;

        Tournament.renderPlayerChips(chipsContainer, {
            isSelected: (name) => players.some(p => p.name.toLowerCase() === name.toLowerCase()),
            onToggle: (name) => {
                saveState();
                const idx = players.findIndex(p => p.name.toLowerCase() === name.toLowerCase());
                if (idx >= 0) players.splice(idx, 1);
                else players.push({ name: name, score: 0, misses: 0, eliminated: false, winner: false });
                if (activeIndex >= players.length) activeIndex = 0;
                render();
            }
        });
    }

    function resetMoelkkyRound() {
        players.forEach(p => {
            p.score = 0;
            p.misses = 0;
            p.eliminated = false;
            p.winner = false;
        });
        activeIndex = 0;
        history = [];
        wasGameOver = false;
        document.getElementById('undoBtn').disabled = true;
        if (tSaveCtrl) tSaveCtrl.reset();
        render();
    }

    function render() {
        const list = document.getElementById('playerList');
        const panel = document.getElementById('inputPanel');
        const endCard = document.getElementById('moelkky-end-card');
        list.innerHTML = "";
        const isGameOver = checkWinCondition();

        if (isGameOver && !wasGameOver && tSaveCtrl) {
            tSaveCtrl.reset();
        }
        wasGameOver = isGameOver;

        if (players.length > 0 && !isGameOver) {
            panel.style.display = 'grid';
            document.getElementById('currentPlayerName').innerText = players[activeIndex].name;
        } else {
            panel.style.display = 'none';
        }

        if (isGameOver && players.length > 0) {
            endCard.classList.remove('hidden');
        } else {
            endCard.classList.add('hidden');
        }

        renderTournamentChips();

        players.forEach((p, i) => {
            const card = document.createElement('div');
            card.className = `player-card ${(!isGameOver && i === activeIndex) ? 'active' : ''} ${p.eliminated ? 'eliminated' : ''} ${p.winner ? 'winner' : ''}`;
            let dots = '';
            for(let d=1; d<=3; d++) dots += `<div class="dot ${p.misses >= d ? 'filled' : ''}"></div>`;

            card.innerHTML = `
                <div class="player-info">
                    <h3>${p.name} ${p.winner ? '🏆' : ''}</h3>
                    <div class="player-stats">
                        <span>${p.winner ? 'GEWONNEN' : (p.eliminated ? 'AUSGESCHIEDEN' : 'Rest: ' + (50-p.score))}</span>
                        ${!p.winner && !p.eliminated ? `<div class="miss-dots">${dots}</div>` : ''}
                    </div>
                </div>
                <div class="score-big">${p.score}</div>
            `;
            list.appendChild(card);
        });
    }

    const tSaveCtrl = window.Tournament ? Tournament.mountSaveButton('t-save-container', {
        gameName: 'Mölkky',
        lowerIsBetter: false,
        getEntries: () => {
            const sorted = [...players].sort((a, b) => {
                if (a.winner !== b.winner) return a.winner ? -1 : 1;
                if (a.eliminated !== b.eliminated) return a.eliminated ? 1 : -1;
                return b.score - a.score;
            });
            return sorted.map((p, idx) => ({
                name: p.name,
                score: p.score,
                rank: idx + 1
            }));
        }
    }) : null;

    renderTournamentChips();
</script>
</body>
</html>
