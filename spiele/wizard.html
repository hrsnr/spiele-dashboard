<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wizard Deluxe Scoreboard</title>
    <link rel="stylesheet" href="../styles.css">
    <script>
        (function() {
            function updateLinks(theme) {
                document.querySelectorAll('a[href]').forEach(function(link) {
                    const raw = link.getAttribute('href');
                    if (!raw || raw.startsWith('#') || raw.startsWith('javascript:')) return;
                    link.setAttribute('href', raw.split('#')[0] + '#theme=' + theme);
                });
            }
            function applyTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                try { localStorage.setItem('spiele_theme', theme); } catch (e) {}
                try { window.name = 'spiele_theme:' + theme; } catch (e) {}
                try { history.replaceState(null, '', location.pathname + location.search + '#theme=' + theme); } catch (e) {}
                updateLinks(theme);
            }
            function getInitialTheme() {
                const hashMatch = (location.hash || '').match(/theme=(dark|light)/);
                if (hashMatch) return hashMatch[1];
                const nameMatch = (window.name || '').match(/spiele_theme:(dark|light)/);
                if (nameMatch) return nameMatch[1];
                try {
                    const saved = localStorage.getItem('spiele_theme');
                    if (saved === 'dark' || saved === 'light') return saved;
                } catch (e) {}
                return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
            }
            applyTheme(getInitialTheme());
            window.addEventListener('DOMContentLoaded', function() {
                applyTheme(document.documentElement.getAttribute('data-theme') || 'dark');
            });
            window.addEventListener('pageshow', function() {
                const nameMatch = (window.name || '').match(/spiele_theme:(dark|light)/);
                if (nameMatch) { applyTheme(nameMatch[1]); return; }
                try {
                    const saved = localStorage.getItem('spiele_theme');
                    if (saved === 'dark' || saved === 'light') applyTheme(saved);
                } catch (err) {}
            });
            window.addEventListener('storage', function(e) {
                if (e.key === 'spiele_theme' && (e.newValue === 'dark' || e.newValue === 'light')) {
                    applyTheme(e.newValue);
                }
            });
            document.addEventListener('click', function(e) {
                const link = e.target && e.target.closest ? e.target.closest('a[href]') : null;
                if (!link) return;
                const raw = link.getAttribute('href');
                if (!raw || raw.startsWith('#') || raw.startsWith('javascript:')) return;
                const theme = document.documentElement.getAttribute('data-theme') || 'dark';
                link.setAttribute('href', raw.split('#')[0] + '#theme=' + theme);
            }, true);
            window.toggleTheme = function() {
                const current = document.documentElement.getAttribute('data-theme') || 'dark';
                applyTheme(current === 'dark' ? 'light' : 'dark');
            };
        })();
    </script>
    <style>
        .container {
            width: 100%;
            max-width: 900px;
        }

        /* Setup-Phase */
        .setup-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }

        /* Spieler-Karten im Spiel */
        .player-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .player-status-card {
            background-color: var(--md-sys-color-surface-container-low);
            border: 1px solid var(--md-sys-color-outline-variant);
            padding: 16px 12px;
            border-radius: var(--md-sys-shape-corner-lg);
            text-align: center;
            position: relative;
            box-shadow: var(--md-sys-elevation-1);
            transition: transform 0.25s ease, background-color 0.25s ease, border-color 0.25s ease;
        }

        .player-status-card.leader {
            border: 2px solid var(--md-sys-color-primary);
            background-color: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            box-shadow: var(--md-sys-elevation-2);
            transform: translateY(-2px);
        }

        .leader-crown {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.4rem;
        }

        .player-label {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--md-sys-color-on-surface-variant);
        }

        .player-status-card.leader .player-label {
            color: var(--md-sys-color-on-primary-container);
        }

        .score-val {
            font-size: 1.85rem;
            font-weight: 800;
            display: block;
            margin-top: 4px;
            color: var(--md-sys-color-primary);
        }

        .player-status-card.leader .score-val {
            color: var(--md-sys-color-on-primary-container);
        }

        /* Eingabe-Bereich */
        .round-info-badge {
            background-color: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            padding: 6px 16px;
            border-radius: var(--md-sys-shape-corner-full);
            font-weight: 700;
            font-size: 0.85rem;
            display: inline-block;
            margin-bottom: 16px;
        }

        .input-group-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
            gap: 12px;
        }

        .mini-card-input {
            background-color: var(--md-sys-color-surface-container);
            padding: 12px;
            border-radius: var(--md-sys-shape-corner-md);
            border: 1px solid var(--md-sys-color-outline-variant);
            text-align: center;
        }

        .mini-card-input input {
            width: 58px;
            padding: 8px 6px;
            text-align: center;
            font-size: 1.05rem;
            font-weight: bold;
        }

        .btn-gold {
            width: 100%;
        }

        /* Tabelle */
        .table-card {
            overflow-x: auto;
            padding: 0;
        }

        .pts-pos { color: var(--md-sys-color-tertiary); font-weight: 800; }
        .pts-neg { color: var(--md-sys-color-error); font-weight: 800; }
        .sub-data { font-size: 0.75rem; color: var(--md-sys-color-on-surface-variant); display: block; }

        /* Winner Overlay */
        #winner-overlay {
            display: none;
        }
    </style>
</head>
<body>

<div id="winner-overlay" class="modal-overlay">
    <div class="winner-card">
        <div style="font-size: 3.5rem;">🧙‍♂️✨</div>
        <h2 style="font-size: 2rem; margin: 10px 0;">Der Meister-Magier!</h2>
        <h3 id="winner-name" style="font-size: 1.75rem; color: var(--md-sys-color-primary);">Spieler</h3>
        <p style="font-size: 1.1rem; color: var(--md-sys-color-on-surface-variant); margin-top: 6px;">Sieg mit <strong id="winner-score" style="color: var(--md-sys-color-on-surface);">0</strong> Punkten</p>
        <button class="btn btn-gold" onclick="location.reload()" style="margin-top: 24px;">Neues Turnier starten</button>
    </div>
</div>

<div class="container">
    <header class="m3-top-app-bar">
        <a href="../index.html" class="m3-nav-btn" aria-label="Hauptmenü" title="Hauptmenü">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        </a>
        <div class="m3-top-app-bar-title-group">
            <h1 class="m3-top-app-bar-title">Wizard</h1>
            <p class="m3-top-app-bar-subtitle">Vorhersagen, Stiche & Punktestände</p>
        </div>
        <button type="button" class="m3-icon-btn" onclick="toggleTheme()" aria-label="Darstellung umschalten" title="Light/Dark Mode umschalten">
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 0 0 0-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
        </button>
    </header>

    <div id="setup-screen" class="card">
        <h3 class="card-title">Gefährten wählen (3–6 Spieler)</h3>
        <div class="setup-grid">
            <input type="text" class="p-name" placeholder="Name Spieler 1">
            <input type="text" class="p-name" placeholder="Name Spieler 2">
            <input type="text" class="p-name" placeholder="Name Spieler 3">
            <input type="text" class="p-name" placeholder="Name Spieler 4 (opt)">
            <input type="text" class="p-name" placeholder="Name Spieler 5 (opt)">
            <input type="text" class="p-name" placeholder="Name Spieler 6 (opt)">
        </div>
        <button class="btn btn-gold" onclick="initGame()" style="margin-top: 20px;">Spiel beginnen</button>
    </div>

    <div id="game-screen" style="display:none;">
        
        <div id="player-display" class="player-row"></div>
        
        <div class="card input-card" id="input-container">
            <div style="text-align: center;">
                <div class="round-info-badge" id="round-title">Runde 1 / 20</div>
            </div>
            <div id="input-fields" class="input-group-grid"></div>
            
            <div class="controls" style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="btn btn-undo" onclick="undoLastRound()" style="flex: 1;">↩ Korrektur</button>
                <button class="btn btn-next" onclick="submitRound()" style="flex: 2;">Runde abschließen</button>
            </div>
        </div>

        <div class="card table-card">
            <table>
                <thead><tr id="history-head"><th style="width: 60px;">Rnd</th></tr></thead>
                <tbody id="history-body"></tbody>
            </table>
        </div>
    </div>
</div>

<script>

    let players = [];
    let currentRound = 1;
    let maxRounds = 0;
    let history = [];

    function initGame() {
        const inputs = document.querySelectorAll('.p-name');
        players = Array.from(inputs).map(i => i.value.trim()).filter(n => n !== "");

        if (players.length < 3) {
            alert("Ein Wizard-Duell benötigt mindestens 3 Magier!");
            return;
        }

        maxRounds = 60 / players.length;
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        
        setupTable();
        renderRoundInputs();
        updateDisplay();
    }

    function setupTable() {
        const head = document.getElementById('history-head');
        players.forEach(p => {
            const th = document.createElement('th');
            th.innerText = p;
            head.appendChild(th);
        });
    }

    function renderRoundInputs() {
        document.getElementById('round-title').innerText = `RUNDE ${currentRound} VON ${maxRounds}`;
        const container = document.getElementById('input-fields');
        container.innerHTML = '';

        players.forEach(p => {
            container.innerHTML += `
                <div class="mini-card-input">
                    <div style="font-weight:bold; margin-bottom:8px; font-size: 0.9rem;">${p}</div>
                    <div style="display:flex; justify-content: center; gap: 6px;">
                        <input type="number" class="bid-in" placeholder="Soll" min="0" inputmode="numeric" onchange="validateVal(this)">
                        <input type="number" class="got-in" placeholder="Ist" min="0" inputmode="numeric" onchange="autoFillIst(this)">
                    </div>
                </div>
            `;
        });
    }

    function validateVal(el) {
        if (parseInt(el.value) > currentRound) {
            alert(`In dieser Runde sind nur ${currentRound} Stiche möglich!`);
            el.value = "";
        }
    }

    function autoFillIst(el) {
        const istInputs = document.querySelectorAll('.got-in');
        let sum = 0;
        let filled = 0;

        istInputs.forEach(input => {
            if (input.value !== "") {
                sum += parseInt(input.value);
                filled++;
            }
        });

        if (sum > currentRound) {
            alert("Halt! Es wurden mehr Stiche verteilt als Karten im Spiel sind.");
            el.value = "";
            return;
        }

        if (sum === currentRound || filled === players.length - 1) {
            istInputs.forEach(input => {
                if (input.value === "") {
                    input.value = Math.max(0, currentRound - sum);
                    sum = currentRound;
                }
            });
        }
    }

    function submitRound() {
        const bids = document.querySelectorAll('.bid-in');
        const gots = document.querySelectorAll('.got-in');
        let roundData = { round: currentRound, results: [] };
        let totalStiche = 0;

        for (let i = 0; i < players.length; i++) {
            let b = parseInt(bids[i].value);
            let g = parseInt(gots[i].value);

            if (isNaN(b) || isNaN(g)) {
                alert("Alle Magier müssen ihre Vorhersagen und Ergebnisse eintragen!");
                return;
            }
            totalStiche += g;
            
            let pts = (b === g) ? (20 + g * 10) : (Math.abs(b - g) * -10);
            roundData.results.push({ bid: b, got: g, points: pts });
        }

        if (totalStiche !== currentRound) {
            alert(`Die Summe der Stiche muss genau ${currentRound} ergeben!`);
            return;
        }

        history.push(roundData);
        addRoundToTable(roundData);
        
        if (currentRound >= maxRounds) {
            updateDisplay();
            showWinner();
        } else {
            currentRound++;
            renderRoundInputs();
            updateDisplay();
        }
    }

    function addRoundToTable(data) {
        const tbody = document.getElementById('history-body');
        const tr = document.createElement('tr');
        let html = `<td><b>${data.round}</b></td>`;
        data.results.forEach(res => {
            const css = res.points >= 0 ? 'pts-pos' : 'pts-neg';
            html += `<td><span class="${css}">${res.points}</span><span class="sub-data">${res.bid} / ${res.got}</span></td>`;
        });
        tr.innerHTML = html;
        tbody.prepend(tr); 
    }

    function updateDisplay() {
        const container = document.getElementById('player-display');
        container.innerHTML = '';
        
        let totals = players.map((p, i) => {
            return { name: p, score: history.reduce((sum, r) => sum + r.results[i].points, 0) };
        });

        let maxScore = Math.max(...totals.map(t => t.score));

        totals.forEach(t => {
            const isLeader = t.score === maxScore && history.length > 0;
            container.innerHTML += `
                <div class="player-status-card ${isLeader ? 'leader' : ''}">
                    ${isLeader ? '<div class="leader-crown">🧙‍♂️</div>' : ''}
                    <div class="player-label">${t.name}</div>
                    <span class="score-val">${t.score}</span>
                </div>
            `;
        });
    }

    function showWinner() {
        let totals = players.map((p, i) => {
            return { name: p, score: history.reduce((sum, r) => sum + r.results[i].points, 0) };
        });
        totals.sort((a, b) => b.score - a.score);
        
        document.getElementById('winner-name').innerText = totals[0].name;
        document.getElementById('winner-score').innerText = totals[0].score;
        document.getElementById('winner-overlay').style.display = 'flex';
    }

    function undoLastRound() {
        if (history.length === 0) return;
        history.pop();
        currentRound = history.length + 1;
        
        const tbody = document.getElementById('history-body');
        tbody.removeChild(tbody.firstChild);
        renderRoundInputs();
        updateDisplay();
        document.getElementById('input-container').style.display = 'block';
        document.getElementById('winner-overlay').style.display = 'none';
    }
</script>
</body>
</html>
