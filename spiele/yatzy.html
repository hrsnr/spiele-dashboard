<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yatzy Digitalblock</title>
    <link rel="stylesheet" href="../styles.css">
    <script>
        (function() {
            function updateLinks(theme) {
                document.querySelectorAll('a[href]').forEach(function(link) {
                    const raw = link.getAttribute('href');
                    if (!raw || raw.startsWith('#') || raw.startsWith('javascript:')) return;
                    link.setAttribute('href', raw.split('#')[0] + '#theme=' + theme);
                });
            }
            function applyTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                try { localStorage.setItem('spiele_theme', theme); } catch (e) {}
                try { window.name = 'spiele_theme:' + theme; } catch (e) {}
                try { history.replaceState(null, '', location.pathname + location.search + '#theme=' + theme); } catch (e) {}
                updateLinks(theme);
            }
            function getInitialTheme() {
                const hashMatch = (location.hash || '').match(/theme=(dark|light)/);
                if (hashMatch) return hashMatch[1];
                const nameMatch = (window.name || '').match(/spiele_theme:(dark|light)/);
                if (nameMatch) return nameMatch[1];
                try {
                    const saved = localStorage.getItem('spiele_theme');
                    if (saved === 'dark' || saved === 'light') return saved;
                } catch (e) {}
                return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
            }
            applyTheme(getInitialTheme());
            window.addEventListener('DOMContentLoaded', function() {
                applyTheme(document.documentElement.getAttribute('data-theme') || 'dark');
            });
            window.addEventListener('pageshow', function() {
                const nameMatch = (window.name || '').match(/spiele_theme:(dark|light)/);
                if (nameMatch) { applyTheme(nameMatch[1]); return; }
                try {
                    const saved = localStorage.getItem('spiele_theme');
                    if (saved === 'dark' || saved === 'light') applyTheme(saved);
                } catch (err) {}
            });
            window.addEventListener('storage', function(e) {
                if (e.key === 'spiele_theme' && (e.newValue === 'dark' || e.newValue === 'light')) {
                    applyTheme(e.newValue);
                }
            });
            document.addEventListener('click', function(e) {
                const link = e.target && e.target.closest ? e.target.closest('a[href]') : null;
                if (!link) return;
                const raw = link.getAttribute('href');
                if (!raw || raw.startsWith('#') || raw.startsWith('javascript:')) return;
                const theme = document.documentElement.getAttribute('data-theme') || 'dark';
                link.setAttribute('href', raw.split('#')[0] + '#theme=' + theme);
            }, true);
            window.toggleTheme = function() {
                const current = document.documentElement.getAttribute('data-theme') || 'dark';
                applyTheme(current === 'dark' ? 'light' : 'dark');
            };
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        .container {
            width: 100%;
            max-width: 520px;
        }

        /* Top Leaderboard Summary */
        .leaderboard-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 6px;
            margin-bottom: 15px;
        }

        .leader-chip {
            background-color: var(--md-sys-color-surface-container-low);
            border: 1px solid var(--md-sys-color-outline-variant);
            border-radius: var(--md-sys-shape-corner-md);
            padding: 8px 14px;
            min-width: 100px;
            flex-shrink: 0;
            text-align: center;
        }

        .leader-chip.is-active {
            border-color: var(--md-sys-color-primary);
            background-color: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
        }

        .chip-name { font-size: 0.8rem; font-weight: 700; color: var(--md-sys-color-on-surface-variant); }
        .leader-chip.is-active .chip-name { color: var(--md-sys-color-on-primary-container); }
        .chip-score { font-size: 1.15rem; font-weight: 800; color: var(--md-sys-color-primary); }
        .leader-chip.is-active .chip-score { color: var(--md-sys-color-on-primary-container); }

        .input-group input[type="text"] { flex-grow: 1; }

        .btn-primary { 
            width: 100%; 
            padding: 15px;
            font-size: 1.05rem;
            margin-top: 15px;
        }

        .btn-undo {
            width: 100%;
            margin-top: 12px;
        }

        /* Block Categories Header */
        .section-header {
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--md-sys-color-primary);
            margin: 18px 0 10px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 2px;
        }

        /* Category Row */
        .category-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--md-sys-color-surface-container);
            border: 1px solid var(--md-sys-color-outline-variant);
            border-radius: var(--md-sys-shape-corner-md);
            padding: 10px 14px;
            margin-bottom: 8px;
        }

        .category-row.filled {
            background-color: var(--md-sys-color-surface-container-low);
            opacity: 0.8;
        }

        .cat-label {
            font-weight: 600;
            font-size: 0.95rem;
            flex-grow: 1;
        }

        .cat-subtext {
            font-size: 0.75rem;
            color: var(--md-sys-color-on-surface-variant);
            display: block;
        }

        /* Inputs & Buttons in Row */
        .cat-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cat-input {
            width: 64px !important;
            padding: 8px !important;
            text-align: center;
            font-weight: 700;
        }

        .btn-save {
            background-color: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            padding: 8px 14px;
            font-size: 0.85rem;
        }

        .btn-zero {
            background-color: var(--md-sys-color-error-container);
            color: var(--md-sys-color-on-error-container);
            border: 1px solid var(--md-sys-color-error);
            padding: 8px 12px;
            font-size: 0.85rem;
        }

        .btn-check {
            background-color: var(--md-sys-color-tertiary-container);
            color: var(--md-sys-color-on-tertiary-container);
            border: 1px solid var(--md-sys-color-tertiary);
            padding: 8px 14px;
            font-size: 0.95rem;
        }

        .btn-cross {
            background-color: var(--md-sys-color-error-container);
            color: var(--md-sys-color-on-error-container);
            border: 1px solid var(--md-sys-color-error);
            padding: 8px 14px;
            font-size: 0.95rem;
        }

        .val-badge {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--md-sys-color-primary);
            padding: 4px 8px;
        }

        /* Summary Boxes */
        .sum-box {
            background-color: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            border: 1px solid var(--md-sys-color-primary);
            border-radius: var(--md-sys-shape-corner-md);
            padding: 12px 16px;
            margin: 12px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .bonus-status {
            font-size: 0.8rem;
            opacity: 0.85;
        }

        .bonus-active { color: var(--md-sys-color-tertiary) !important; font-weight: bold; opacity: 1; }

        .setup-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--md-sys-color-surface-container);
            border: 1px solid var(--md-sys-color-outline-variant);
            padding: 10px 14px;
            border-radius: var(--md-sys-shape-corner-md);
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <header class="m3-top-app-bar">
        <a href="../index.html" class="m3-nav-btn" aria-label="Hauptmenü" title="Hauptmenü">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        </a>
        <div class="m3-top-app-bar-title-group">
            <h1 class="m3-top-app-bar-title">Yatzy</h1>
            <p class="m3-top-app-bar-subtitle">Digitaler Spielblock</p>
        </div>
        <button type="button" class="m3-icon-btn" onclick="toggleTheme()" aria-label="Darstellung umschalten" title="Light/Dark Mode umschalten">
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 0 0 0-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
        </button>
    </header>

    <!-- SETUP SCREEN -->
    <div id="setupScreen" class="card">
        <h3 class="card-title">Spieler hinzufügen</h3>
        <div class="input-group">
            <input type="text" id="playerNameInput" placeholder="Name eingeben..." onkeypress="if(event.key==='Enter') addPlayer()">
            <button class="btn-add" onclick="addPlayer()">+</button>
        </div>
        <div id="setupPlayerList" style="margin-top: 15px;"></div>
        <button id="startGameBtn" class="btn-primary" style="display:none;" onclick="startGame()">Spiel starten</button>
    </div>

    <!-- GAME SCREEN -->
    <div id="gameScreen" style="display:none;">
        
        <!-- Top Leaderboard Summary -->
        <div class="leaderboard-bar" id="topLeaderboard"></div>

        <!-- Active Player Scorecard Card -->
        <div class="card">
            <div style="text-align: center; margin-bottom: 15px;">
                <span style="color: var(--md-sys-color-on-surface-variant); font-size: 0.8rem; text-transform: uppercase;">Am Zug</span>
                <h2 id="activePlayerName" style="margin: 2px 0 0 0; font-size: 1.8rem; color: var(--md-sys-color-on-surface);">-</h2>
            </div>

            <!-- OBERER TEIL -->
            <div class="section-header">
                <span>Oberer Teil</span>
                <span id="upperTotalBadge" style="color: var(--md-sys-color-on-surface-variant); font-size: 0.78rem;">0 / 63 Pkt</span>
            </div>

            <div id="upperSectionFields"></div>

            <div class="sum-box">
                <div>
                    <strong>Zwischensumme Oben:</strong>
                    <div id="bonusProgressText" class="bonus-status">Noch 63 Pkt bis Bonus (50 Pkt)</div>
                </div>
                <div id="upperSumValue" style="font-size: 1.35rem; font-weight: 800;">0</div>
            </div>

            <!-- UNTERER TEIL -->
            <div class="section-header">
                <span>Unterer Teil</span>
            </div>

            <div id="lowerSectionFields"></div>

            <button id="undoBtn" class="btn-undo" onclick="undoLastAction()" style="display:none;">↩ Letzte Eingabe korrigieren</button>
        </div>
    </div>

    <!-- GAME OVER MODAL -->
    <div id="gameOverModal" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <h2>🎉 Spiel beendet!</h2>
            <div id="winnerRankingList" style="margin: 20px 0;"></div>
            <button class="btn-primary" onclick="resetGameSamePlayers()">🔄 Neue Runde (Gleiche Spieler)</button>
            <button class="btn-undo" onclick="resetEntireGame()" style="margin-top: 10px;">Neues Spiel (Neue Spieler)</button>
        </div>
    </div>
</div>

<script>

    const CATEGORIES = {
        // Oberer Teil
        einer: { name: 'Einser', type: 'upper', factor: 1, max: 5 },
        zweier: { name: 'Zweier', type: 'upper', factor: 2, max: 10 },
        dreier: { name: 'Dreier', type: 'upper', factor: 3, max: 15 },
        vierer: { name: 'Vierer', type: 'upper', factor: 4, max: 20 },
        fuenfer: { name: 'Fünfer', type: 'upper', factor: 5, max: 25 },
        sechser: { name: 'Sechser', type: 'upper', factor: 6, max: 30 },
        // Unterer Teil (Yatzy-Regeln: Augensummen-Eingabe)
        paar: { name: '1 Paar', type: 'numeric', max: 12, subtext: 'Summe der 2 Würfel (max. 12)' },
        zweiPaare: { name: '2 Paare', type: 'numeric', max: 22, subtext: 'Summe der 4 Würfel (max. 22)' },
        dreierpasch: { name: '3er Pasch', type: 'numeric', max: 18, subtext: 'Summe der 3 gleichen Würfel' },
        viererpasch: { name: '4er Pasch', type: 'numeric', max: 24, subtext: 'Summe der 4 gleichen Würfel' },
        kleinestrasse: { name: 'Kleine Straße', type: 'fixed', score: 15, subtext: '1-2-3-4-5 (15 Pkt)' },
        grossestrasse: { name: 'Große Straße', type: 'fixed', score: 20, subtext: '2-3-4-5-6 (20 Pkt)' },
        fullhouse: { name: 'Full House', type: 'numeric', max: 28, subtext: '3er Pasch + 1 Paar (Summe aller 5 Würfel)' },
        chance: { name: 'Chance', type: 'numeric', max: 30, subtext: 'Summe aller 5 Würfel' },
        yatzy: { name: 'Yatzy', type: 'fixed', score: 50, subtext: '5 gleiche Würfel (50 Pkt)' }
    };

    let players = [];
    let currentPlayerIndex = 0;
    let history = [];

    // --- SETUP FUNKTIONEN ---
    function addPlayer() {
        const input = document.getElementById('playerNameInput');
        const name = input.value.trim();
        if (name !== "") {
            players.push({
                name: name,
                scores: {
                    einer: null, zweier: null, dreier: null, vierer: null, fuenfer: null, sechser: null,
                    paar: null, zweiPaare: null, dreierpasch: null, viererpasch: null,
                    kleinestrasse: null, grossestrasse: null, fullhouse: null, chance: null, yatzy: null
                }
            });
            input.value = "";
            renderSetupList();
        }
    }

    function removePlayer(idx) {
        players.splice(idx, 1);
        renderSetupList();
    }

    function renderSetupList() {
        const list = document.getElementById('setupPlayerList');
        const startBtn = document.getElementById('startGameBtn');
        list.innerHTML = "";

        players.forEach((p, idx) => {
            const item = document.createElement('div');
            item.className = 'setup-item';
            item.innerHTML = `
                <span>${p.name}</span>
                <span style="color: var(--md-sys-color-error); cursor: pointer; font-weight: bold;" onclick="removePlayer(${idx})">✕</span>
            `;
            list.appendChild(item);
        });

        startBtn.style.display = players.length >= 1 ? 'inline-flex' : 'none';
    }

    function startGame() {
        document.getElementById('setupScreen').style.display = 'none';
        document.getElementById('gameScreen').style.display = 'block';
        currentPlayerIndex = 0;
        history = [];
        renderGame();
    }

    // --- RECHNUNG & STATS ---
    function calculatePlayerTotals(player) {
        const s = player.scores;
        let upperSum = 0;
        const upperKeys = ['einer', 'zweier', 'dreier', 'vierer', 'fuenfer', 'sechser'];
        
        upperKeys.forEach(k => {
            if (s[k] !== null) upperSum += s[k];
        });

        // Yatzy-Bonus: 50 Punkte ab 63 Punkten im oberen Teil
        const bonus = upperSum >= 63 ? 50 : 0;

        let lowerSum = 0;
        const lowerKeys = ['paar', 'zweiPaare', 'dreierpasch', 'viererpasch', 'kleinestrasse', 'grossestrasse', 'fullhouse', 'chance', 'yatzy'];
        lowerKeys.forEach(k => {
            if (s[k] !== null) lowerSum += s[k];
        });

        return {
            upperSum: upperSum,
            bonus: bonus,
            lowerSum: lowerSum,
            total: upperSum + bonus + lowerSum
        };
    }

    function isGameComplete() {
        return players.every(p => Object.values(p.scores).every(val => val !== null));
    }

    // --- EINGABE-LOGIK & VALIDIERUNG ---
    function saveHistory() {
        history.push(JSON.stringify({
            players: players,
            currentPlayerIndex: currentPlayerIndex
        }));
    }

    function undoLastAction() {
        if (history.length > 0) {
            const state = JSON.parse(history.pop());
            players = state.players;
            currentPlayerIndex = state.currentPlayerIndex;
            document.getElementById('gameOverModal').style.display = 'none';
            renderGame();
        }
    }

    function submitScore(catKey, value) {
        const cat = CATEGORIES[catKey];

        // Plausibilitätsprüfungen
        if (cat.type === 'upper') {
            if (value !== 0) {
                if (value < 0 || value > cat.max || value % cat.factor !== 0) {
                    alert(`Ungültige Punkte für ${cat.name}! Muss durch ${cat.factor} teilbar und max. ${cat.max} sein.`);
                    return;
                }
            }
        } else if (cat.type === 'numeric') {
            if (value !== 0) {
                if (value < 2 || (cat.max && value > cat.max)) {
                    alert(`Ungültige Augenzahl für ${cat.name}! (Maximal ${cat.max} Punkte möglich).`);
                    return;
                }
            }
        }

        saveHistory();
        players[currentPlayerIndex].scores[catKey] = value;

        advanceTurn();
    }

    function clearScore(catKey) {
        saveHistory();
        players[currentPlayerIndex].scores[catKey] = null;
        renderGame();
    }

    function advanceTurn() {
        if (isGameComplete()) {
            renderGame();
            showGameOver();
            return;
        }

        // Wechsle zum nächsten Spieler
        currentPlayerIndex = (currentPlayerIndex + 1) % players.length;

        // Falls dieser Spieler bereits alle Felder voll hat, weiterschalten
        let checkCount = 0;
        while (Object.values(players[currentPlayerIndex].scores).every(v => v !== null) && checkCount < players.length) {
            currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
            checkCount++;
        }

        renderGame();
    }

    // --- RENDERING ---
    function renderGame() {
        const activePlayer = players[currentPlayerIndex];
        const totals = calculatePlayerTotals(activePlayer);

        document.getElementById('activePlayerName').innerText = activePlayer.name;
        document.getElementById('undoBtn').style.display = history.length > 0 ? 'inline-flex' : 'none';

        // Top Leaderboard Bar
        const topBar = document.getElementById('topLeaderboard');
        topBar.innerHTML = "";
        players.forEach((p, idx) => {
            const pTotals = calculatePlayerTotals(p);
            const chip = document.createElement('div');
            chip.className = `leader-chip ${idx === currentPlayerIndex ? 'is-active' : ''}`;
            chip.innerHTML = `
                <div class="chip-name">${p.name}</div>
                <div class="chip-score">${pTotals.total}</div>
            `;
            topBar.appendChild(chip);
        });

        // Oberer Teil Render
        document.getElementById('upperSumValue').innerText = totals.upperSum;
        document.getElementById('upperTotalBadge').innerText = `${totals.upperSum} / 63 Pkt`;
        const bonusStatusEl = document.getElementById('bonusProgressText');
        if (totals.bonus > 0) {
            bonusStatusEl.innerText = "✓ Bonus (+50 Pkt) erreicht!";
            bonusStatusEl.className = "bonus-status bonus-active";
        } else {
            const diff = 63 - totals.upperSum;
            bonusStatusEl.innerText = `Noch ${diff > 0 ? diff : 0} Pkt bis Bonus (50 Pkt)`;
            bonusStatusEl.className = "bonus-status";
        }

        renderSectionFields('upperSectionFields', ['einer', 'zweier', 'dreier', 'vierer', 'fuenfer', 'sechser']);
        renderSectionFields('lowerSectionFields', ['paar', 'zweiPaare', 'dreierpasch', 'viererpasch', 'kleinestrasse', 'grossestrasse', 'fullhouse', 'chance', 'yatzy']);
    }

    function renderSectionFields(containerId, categoryKeys) {
        const container = document.getElementById(containerId);
        container.innerHTML = "";

        const activePlayer = players[currentPlayerIndex];

        categoryKeys.forEach(key => {
            const cat = CATEGORIES[key];
            const currentVal = activePlayer.scores[key];
            const row = document.createElement('div');
            row.className = `category-row ${currentVal !== null ? 'filled' : ''}`;

            let actionHtml = "";

            if (currentVal !== null) {
                // Bereits eingetragen -> Wert anzeigen & Korrektur Button
                actionHtml = `
                    <div class="cat-actions">
                        <span class="val-badge">${currentVal}</span>
                        <button class="btn-zero" title="Eintrag löschen / korrigieren" onclick="clearScore('${key}')">✏️</button>
                    </div>
                `;
            } else {
                // Noch offen -> Eingabemöglichkeit
                if (cat.type === 'fixed') {
                    actionHtml = `
                        <div class="cat-actions">
                            <button class="btn-check" onclick="submitScore('${key}', ${cat.score})">✓ ${cat.score}</button>
                            <button class="btn-cross" onclick="submitScore('${key}', 0)">✕ 0</button>
                        </div>
                    `;
                } else {
                    actionHtml = `
                        <div class="cat-actions">
                            <input type="number" id="input_${key}" class="cat-input" placeholder="0" inputmode="numeric">
                            <button class="btn-save" onclick="readAndSubmit('${key}')">OK</button>
                            <button class="btn-zero" onclick="submitScore('${key}', 0)">0</button>
                        </div>
                    `;
                }
            }

            row.innerHTML = `
                <div>
                    <span class="cat-label">${cat.name}</span>
                    ${cat.subtext ? `<span class="cat-subtext">${cat.subtext}</span>` : ''}
                </div>
                ${actionHtml}
            `;
            container.appendChild(row);
        });
    }

    function readAndSubmit(key) {
        const input = document.getElementById(`input_${key}`);
        const val = input.value === "" ? 0 : parseInt(input.value);
        submitScore(key, val);
    }

    // --- GAME OVER & ENDERGEBNIS ---
    function showGameOver() {
        shootConfetti();
        const modal = document.getElementById('gameOverModal');
        const rankingList = document.getElementById('winnerRankingList');

        // Spieler nach Gesamtpunktzahl sortieren
        const ranked = players.map(p => {
            return {
                name: p.name,
                totals: calculatePlayerTotals(p)
            };
        }).sort((a, b) => b.totals.total - a.totals.total);

        rankingList.innerHTML = ranked.map((r, idx) => `
            <div class="category-row" style="margin-bottom: 10px;">
                <div style="text-align: left;">
                    <strong>${idx === 0 ? '👑 ' : ''}${idx + 1}. ${r.name}</strong>
                    <div style="font-size: 0.75rem; color: var(--md-sys-color-on-surface-variant);">Oben: ${r.totals.upperSum} (${r.totals.bonus ? '+50 Bonus' : 'kein Bonus'}) | Unten: ${r.totals.lowerSum}</div>
                </div>
                <div style="font-size: 1.3rem; font-weight: 800; color: var(--md-sys-color-primary);">${r.totals.total} Pkt</div>
            </div>
        `).join('');

        modal.style.display = 'flex';
    }

    function resetGameSamePlayers() {
        players.forEach(p => {
            Object.keys(p.scores).forEach(k => p.scores[k] = null);
        });
        document.getElementById('gameOverModal').style.display = 'none';
        startGame();
    }

    function resetEntireGame() {
        players = [];
        history = [];
        document.getElementById('gameOverModal').style.display = 'none';
        document.getElementById('gameScreen').style.display = 'none';
        document.getElementById('setupScreen').style.display = 'block';
        renderSetupList();
    }

    function shootConfetti() {
        const duration = 3 * 1000;
        const end = Date.now() + duration;

        (function frame() {
            confetti({
                particleCount: 3,
                angle: 60,
                spread: 55,
                origin: { x: 0 },
                colors: ['#0b57d0', '#fbbc04', '#146c2e']
            });
            confetti({
                particleCount: 3,
                angle: 120,
                spread: 55,
                origin: { x: 1 },
                colors: ['#0b57d0', '#fbbc04', '#146c2e']
            });

            if (Date.now() < end) {
                requestAnimationFrame(frame);
            }
        }());
    }
</script>

</body>
</html>
