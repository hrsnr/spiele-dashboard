<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flip7 Scorekeeper</title>
    <link rel="stylesheet" href="../styles.css">
    <script>
        (function() {
            function updateLinks(theme) {
                document.querySelectorAll('a[href]').forEach(function(link) {
                    const raw = link.getAttribute('href');
                    if (!raw || raw.startsWith('#') || raw.startsWith('javascript:')) return;
                    link.setAttribute('href', raw.split('#')[0] + '#theme=' + theme);
                });
            }
            function applyTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                try { localStorage.setItem('spiele_theme', theme); } catch (e) {}
                try { window.name = 'spiele_theme:' + theme; } catch (e) {}
                try { history.replaceState(null, '', location.pathname + location.search + '#theme=' + theme); } catch (e) {}
                updateLinks(theme);
            }
            function getInitialTheme() {
                const hashMatch = (location.hash || '').match(/theme=(dark|light)/);
                if (hashMatch) return hashMatch[1];
                const nameMatch = (window.name || '').match(/spiele_theme:(dark|light)/);
                if (nameMatch) return nameMatch[1];
                try {
                    const saved = localStorage.getItem('spiele_theme');
                    if (saved === 'dark' || saved === 'light') return saved;
                } catch (e) {}
                return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
            }
            applyTheme(getInitialTheme());
            window.addEventListener('DOMContentLoaded', function() {
                applyTheme(document.documentElement.getAttribute('data-theme') || 'dark');
            });
            window.addEventListener('pageshow', function() {
                const nameMatch = (window.name || '').match(/spiele_theme:(dark|light)/);
                if (nameMatch) { applyTheme(nameMatch[1]); return; }
                try {
                    const saved = localStorage.getItem('spiele_theme');
                    if (saved === 'dark' || saved === 'light') applyTheme(saved);
                } catch (err) {}
            });
            window.addEventListener('storage', function(e) {
                if (e.key === 'spiele_theme' && (e.newValue === 'dark' || e.newValue === 'light')) {
                    applyTheme(e.newValue);
                }
            });
            document.addEventListener('click', function(e) {
                const link = e.target && e.target.closest ? e.target.closest('a[href]') : null;
                if (!link) return;
                const raw = link.getAttribute('href');
                if (!raw || raw.startsWith('#') || raw.startsWith('javascript:')) return;
                const theme = document.documentElement.getAttribute('data-theme') || 'dark';
                link.setAttribute('href', raw.split('#')[0] + '#theme=' + theme);
            }, true);
            window.toggleTheme = function() {
                const current = document.documentElement.getAttribute('data-theme') || 'dark';
                applyTheme(current === 'dark' ? 'light' : 'dark');
            };
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        .container {
            width: 100%;
            max-width: 520px;
        }

        .input-group input[type="text"] { flex-grow: 1; }
        input[type="number"] { width: 88px; text-align: center; font-weight: bold; font-size: 1.2rem; }

        .btn-confirm { 
            width: 100%; 
            padding: 16px;
            font-size: 1.05rem;
            margin-top: 20px;
        }
        
        .btn-undo {
            width: 100%;
            margin-top: 12px;
        }

        .player-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
            background-color: var(--md-sys-color-surface-container-low);
            padding: 16px;
            border-radius: var(--md-sys-shape-corner-lg);
            border: 1px solid var(--md-sys-color-outline-variant);
            box-shadow: var(--md-sys-elevation-1);
            transition: all 0.25s ease;
        }

        .leader {
            border-color: var(--md-sys-color-primary);
            background-color: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
        }

        .winner-card {
            background-color: var(--md-sys-color-warning-container);
            color: var(--md-sys-color-on-warning-container);
            border: 2px solid var(--md-sys-color-warning);
            transform: scale(1.02);
        }

        .player-info { flex-grow: 1; }
        .player-name { font-size: 1.15rem; font-weight: 700; }
        .score-stats { font-size: 0.85rem; color: var(--md-sys-color-on-surface-variant); margin-top: 4px; }
        .leader .score-stats { color: var(--md-sys-color-on-primary-container); opacity: 0.85; }
        .winner-card .score-stats { color: var(--md-sys-color-on-warning-container); }
        .total-val { color: var(--md-sys-color-primary); font-weight: 800; font-size: 1rem; }
        .leader .total-val { color: var(--md-sys-color-on-primary-container); }
        .winner-text { color: var(--md-sys-color-warning); font-weight: bold; }
        .winner-card .winner-text { color: var(--md-sys-color-on-warning-container); }

        .crown { font-size: 1.2rem; margin-right: 5px; }

        .modal-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <header class="m3-top-app-bar">
        <a href="../index.html" class="m3-nav-btn" aria-label="Hauptmenü" title="Hauptmenü">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        </a>
        <div class="m3-top-app-bar-title-group">
            <h1 class="m3-top-app-bar-title">Flip7</h1>
            <p class="m3-top-app-bar-subtitle">Ziel: 200 Punkte</p>
        </div>
        <button type="button" class="m3-icon-btn" onclick="toggleTheme()" aria-label="Darstellung umschalten" title="Light/Dark Mode umschalten">
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 0 0 0-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
        </button>
    </header>

    <!-- Spieler-Eingabe -->
    <div id="setupCard" class="setup-card">
        <h3 class="card-title">Spieler hinzufügen</h3>
        <div class="input-group">
            <input type="text" id="playerName" placeholder="Spielername..." onkeypress="if(event.key==='Enter') addPlayer()">
            <button class="btn-add" onclick="addPlayer()">+</button>
        </div>
    </div>

    <!-- Aktives Spiel -->
    <div id="gameArea" style="display:none;">
        <div id="playerInputList"></div>
        <button class="btn-confirm" onclick="submitRound()">Runde abschließen</button>
        <button id="undoBtn" class="btn-undo" onclick="undoLastRound()" style="display:none;">↩ Korrigieren</button>
    </div>

    <!-- Highscore / Siege-Übersicht -->
    <div id="highscoreArea" class="setup-card" style="display:none;">
        <h2 style="text-align: center; margin-top: 0; color: var(--md-sys-color-primary);">🏆 Highscore</h2>
        <p style="text-align: center; color: var(--md-sys-color-on-surface-variant); font-size: 0.85rem; margin-bottom: 18px;">Gewonnene Runden</p>
        <div id="highscoreList"></div>
        <button class="btn-confirm" onclick="resetEntireGame()" style="margin-top: 20px;">Neues Spiel (Neue Spieler)</button>
        <button class="btn-undo" onclick="startNextRoundSamePlayers()" style="margin-top: 10px;">🔄 Gleiche Spieler nochmal</button>
    </div>
</div>

<!-- Modal Dialog nach Spielende -->
<div id="gameOverModal" class="modal-overlay" style="display:none;">
    <div class="modal-content">
        <h2 style="margin-top:0;">🎉 Runde beendet!</h2>
        <p id="modalWinnerDesc" style="color: var(--md-sys-color-on-surface-variant); margin: 12px 0 20px 0;"></p>
        <p style="font-weight: 600; margin-bottom: 20px;">Möchtest du eine weitere Runde mit denselben Spielern spielen?</p>
        <div class="modal-actions">
            <button class="btn-confirm" style="margin-top:0;" onclick="startNextRoundSamePlayers()">Ja, weitere Runde</button>
            <button class="btn-add" style="padding: 14px; width: 100%; font-size: 1rem;" onclick="showHighscore()">Nein, Highscore anzeigen</button>
            <button class="btn-undo" style="margin-top: 5px;" onclick="undoLastRound()">↩ Eingabe korrigieren</button>
        </div>
    </div>
</div>

<script>
    let players = [];
    let history = []; 
    let hasWonBefore = false;
    const TARGET_SCORE = 200;

    function addPlayer() {
        const nameInput = document.getElementById('playerName');
        const name = nameInput.value.trim();
        if (name !== "") {
            players.push({ name: name, score: 0, wins: 0 });
            nameInput.value = "";
            renderList();
        }
    }

    function renderList() {
        const gameArea = document.getElementById('gameArea');
        const inputList = document.getElementById('playerInputList');
        const undoBtn = document.getElementById('undoBtn');

        if (players.length > 0) gameArea.style.display = "block";
        undoBtn.style.display = history.length > 0 ? "inline-flex" : "none";

        const maxScore = Math.max(...players.map(p => p.score));
        const gameFinished = maxScore >= TARGET_SCORE;

        if (gameFinished && !hasWonBefore) {
            shootConfetti();
            hasWonBefore = true;
        } else if (!gameFinished) {
            hasWonBefore = false;
        }

        inputList.innerHTML = "";

        players.forEach((player, index) => {
            const isWinner = gameFinished && player.score === maxScore;
            const isLeader = !gameFinished && player.score === maxScore && maxScore > 0;
            const pointsToWin = TARGET_SCORE - player.score;
            
            const div = document.createElement('div');
            div.className = `player-card ${isWinner ? 'winner-card' : ''} ${isLeader ? 'leader' : ''}`;
            
            div.innerHTML = `
                <div class="player-info">
                    <div>
                        ${isWinner || isLeader ? '<span class="crown">👑</span>' : ''}
                        <span class="player-name">${player.name}</span>
                    </div>
                    <div class="score-stats">
                        <span class="total-val">${player.score}</span> 
                        <span style="margin: 0 8px; opacity: 0.4">/</span>
                        <span class="${isWinner ? 'winner-text' : ''}">${isWinner ? 'CHAMPION! 🏆' : 'noch ' + (pointsToWin > 0 ? pointsToWin : 0)}</span>
                    </div>
                </div>
                <input type="number" class="score-input" data-index="${index}" placeholder="0" inputmode="numeric" onfocus="this.select()">
            `;
            inputList.appendChild(div);
        });
    }

    function submitRound() {
        const inputs = document.querySelectorAll('.score-input');
        let hasChanges = false;

        // Zustand vor Rundenabschluss im Verlauf speichern
        history.push(JSON.parse(JSON.stringify(players)));

        inputs.forEach(input => {
            const idx = input.getAttribute('data-index');
            const val = parseInt(input.value) || 0;
            if (val !== 0) {
                players[idx].score += val;
                hasChanges = true;
            }
            input.value = ""; 
        });

        if (hasChanges) {
            const maxScore = Math.max(...players.map(p => p.score));
            if (maxScore >= TARGET_SCORE) {
                // Gewinner ermitteln und Siege hochzählen
                players.forEach(p => {
                    if (p.score === maxScore) p.wins += 1;
                });
                renderList();
                showGameOverModal(maxScore);
            } else {
                renderList();
            }
        } else {
            history.pop();
        }
    }

    function showGameOverModal(maxScore) {
        const winners = players.filter(p => p.score === maxScore).map(p => p.name);
        const desc = document.getElementById('modalWinnerDesc');
        
        if (winners.length === 1) {
            desc.innerHTML = `Gewinner der Runde: <strong style="color: var(--md-sys-color-primary);">${winners[0]}</strong>`;
        } else {
            desc.innerHTML = `Gewinner der Runde: <strong style="color: var(--md-sys-color-primary);">${winners.join(', ')}</strong>`;
        }

        setTimeout(() => {
            document.getElementById('gameOverModal').style.display = 'flex';
        }, 500);
    }

    function startNextRoundSamePlayers() {
        players.forEach(p => p.score = 0);
        history = [];
        hasWonBefore = false;
        
        document.getElementById('gameOverModal').style.display = 'none';
        document.getElementById('highscoreArea').style.display = 'none';
        document.getElementById('setupCard').style.display = 'block';
        document.getElementById('gameArea').style.display = 'block';
        
        renderList();
    }

    function showHighscore() {
        document.getElementById('gameOverModal').style.display = 'none';
        document.getElementById('gameArea').style.display = 'none';
        document.getElementById('setupCard').style.display = 'none';
        
        const hsArea = document.getElementById('highscoreArea');
        const hsList = document.getElementById('highscoreList');
        hsArea.style.display = 'block';
        
        // Nach Siegen sortieren
        const sorted = [...players].sort((a, b) => b.wins - a.wins);
        
        hsList.innerHTML = sorted.map((p, idx) => `
            <div class="player-card">
                <div class="player-info">
                    <span class="player-name">${idx === 0 && p.wins > 0 ? '👑 ' : ''}${p.name}</span>
                </div>
                <div style="font-weight: 800; color: var(--md-sys-color-primary); font-size: 1.1rem;">
                    ${p.wins} ${p.wins === 1 ? 'Sieg' : 'Siege'}
                </div>
            </div>
        `).join('');
    }

    function resetEntireGame() {
        players = [];
        history = [];
        hasWonBefore = false;
        
        document.getElementById('highscoreArea').style.display = 'none';
        document.getElementById('gameArea').style.display = 'none';
        document.getElementById('setupCard').style.display = 'block';
        document.getElementById('playerName').value = '';
    }

    function undoLastRound() {
        if (history.length > 0) {
            players = history.pop();
            hasWonBefore = false;
            
            document.getElementById('gameOverModal').style.display = 'none';
            document.getElementById('highscoreArea').style.display = 'none';
            document.getElementById('setupCard').style.display = 'block';
            document.getElementById('gameArea').style.display = players.length > 0 ? 'block' : 'none';
            
            renderList();
        }
    }

    function shootConfetti() {
        const duration = 3 * 1000;
        const end = Date.now() + duration;

        (function frame() {
            confetti({
                particleCount: 3,
                angle: 60,
                spread: 55,
                origin: { x: 0 },
                colors: ['#0b57d0', '#fbbc04', '#146c2e']
            });
            confetti({
                particleCount: 3,
                angle: 120,
                spread: 55,
                origin: { x: 1 },
                colors: ['#0b57d0', '#fbbc04', '#146c2e']
            });

            if (Date.now() < end) {
                requestAnimationFrame(frame);
            }
        }());
    }
</script>

</body>
</html>
